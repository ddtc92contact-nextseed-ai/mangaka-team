name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    env:
      MANGAKA_SKIP_ENGINE_SETUP: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  engine:
    name: Moteur (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Extra qc → onnxruntime CPU (jamais onnxruntime-gpu)
        run: |
          pip install --dry-run --quiet --ignore-installed --report /tmp/qc-report.json -e ".[qc]"
          python - <<'EOF'
          import json
          names = {i["metadata"]["name"].lower() for i in json.load(open("/tmp/qc-report.json"))["install"]}
          print(sorted(n for n in names if "onnx" in n or "imgutils" in n))
          assert "onnxruntime" in names, "onnxruntime absent de l'extra qc"
          assert "onnxruntime-gpu" not in names, "l'extra qc tire onnxruntime-gpu"
          EOF

  launcher:
    name: Lanceur (shellcheck, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y shellcheck desktop-file-utils
      - run: pip install pytest ruff
      - run: shellcheck -x scripts/*.sh
      - run: ruff check --config engine/pyproject.toml scripts/tests
      - run: ruff format --config engine/pyproject.toml --check scripts/tests
      - run: python -m pytest scripts/tests -q
