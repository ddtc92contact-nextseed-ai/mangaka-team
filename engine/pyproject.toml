[project]
name = "mangaka-engine"
version = "0.1.0"
description = "Moteur local de mangaka-team (FastAPI + SQLite + ComfyUI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "pillow>=10.4",
  "websockets>=13",
  "pyphen>=0.15",
  "fonttools>=4.50",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mangaka_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]
