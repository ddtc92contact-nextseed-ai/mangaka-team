# Paramètres des fournisseurs. Les clés d'API vont dans .env, jamais ici.
# Les variables d'environnement DEEPSEEK_BASE_URL / DEEPSEEK_MODEL priment sur ces valeurs.
deepseek:
  base_url: https://api.deepseek.com
  model: deepseek-chat
  timeout_s: 60
  temperature: 0.7
  # DeepSeek n'accepte pas encore d'images : le contrôle qualité visuel
  # passera par Ollama (Qwen3-VL 4B chargé à la demande, keep_alive 0).
  supports_images: false

ollama:
  base_url: http://127.0.0.1:11434
  vision_model: qwen3-vl:4b
  keep_alive: 0
  timeout_s: 120
