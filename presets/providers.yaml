# Paramètres des fournisseurs. Les clés d'API vont dans .env, jamais ici.
# Les variables d'environnement DEEPSEEK_BASE_URL / DEEPSEEK_MODEL priment sur ces valeurs.
deepseek:
  base_url: https://api.deepseek.com
  model: deepseek-flash   # modèle rapide ; deepseek-v4-pro reste un choix volontaire par agent
  timeout_s: 300   # un chapitre complet en JSON peut prendre plusieurs minutes
  temperature: 0.7
  # DeepSeek n'accepte pas encore d'images : le contrôle qualité visuel
  # passera par Ollama (Qwen3-VL 4B chargé à la demande, keep_alive 0).
  supports_images: false
  # Modèles proposés dans « L'équipe » (liste déroulante « Modèle » de chaque agent DeepSeek). Le moteur
  # interroge GET {base_url}/models (cache `models_cache_s`) ; cette liste sert quand la clé manque, en mode
  # mock ou si l'appel échoue, et donne libellé et note aux modèles connus.
  # `reasoning: true` : le modèle raisonne avant de répondre (reasoning_content) et refuse la température,
  # qui n'est donc pas envoyée. `timeout_s` remplace le délai ci-dessus pour ce modèle.
  models_cache_s: 300
  models:
    - id: deepseek-flash
      label: DeepSeek Flash
      note: rapide, sans raisonnement
    - id: deepseek-v4-pro
      label: DeepSeek V4 Pro
      note: raisonne avant de répondre, plus lent
      reasoning: true
      timeout_s: 900   # le raisonnement s'ajoute à l'écriture d'un chapitre complet
    # Anciens noms, gardés pour les agents déjà réglés dessus. DeepSeek résout deepseek-chat en deepseek-flash.
    - id: deepseek-chat
      label: DeepSeek Chat
      note: ancien alias de deepseek-flash
    - id: deepseek-reasoner
      label: DeepSeek Reasoner
      note: raisonne avant de répondre, plus lent
      reasoning: true
      timeout_s: 900   # comme deepseek-v4-pro
  # Setup par classe de modèle : court préambule fondu en tête du premier message système de chaque appel
  # (jamais en double). Les consignes des agents et leur format de sortie ne changent pas d'un modèle à
  # l'autre. `fast` : classe rapide (vide, les consignes sont réglées pour elle) ; `reasoning` : modèles
  # `reasoning: true` (ou devinés d'après le nom pour un modèle tapé à la main).
  preambles:
    fast: ""
    reasoning: >-
      Modèle qui raisonne : pèse les contraintes de la consigne, puis rends uniquement la réponse demandée,
      dans le format exact spécifié, sans commentaire ni texte hors format.

ollama:
  base_url: http://127.0.0.1:11434
  vision_model: qwen3-vl:4b
  # Embeddings du savoir-faire (EMBEDDING_PROVIDER=ollama). Suggestion : bge-m3, multilingue, bon en
  # français (≈ 1,2 Go). Rien n'est téléchargé automatiquement : `ollama pull bge-m3` une fois validé.
  embedding_model: bge-m3
  keep_alive: 0
  # Taille de contexte envoyée à Ollama (options.num_ctx). Sans elle, Ollama charge le modèle à son
  # contexte maximal (262 144 jetons pour qwen3-vl : ≈ 45 Go et ~20 s par case). 4096 suffit pour une
  # case (≈ 1 400 jetons d'image) + le prompt + la réponse JSON : ≈ 4,7 Go et ~3 s.
  vision_num_ctx: 4096
  # Idem pour les embeddings : 8192 = contexte natif maximal de bge-m3.
  embedding_num_ctx: 8192
  timeout_s: 120
