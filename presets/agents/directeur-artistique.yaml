# Agent de direction artistique, entre le scénario et la mise en page — voir presets/README.md
# (« L'équipe : agents du pipeline » et « Direction artistique »).
id: directeur-artistique
name: Directeur artistique
icon: "🎬"
role: >-
  Décide du rythme de chaque page, de l'intensité et du cadrage de chaque case (plan, angle, cadre,
  ambiance, onomatopées) et justifie ses choix ; l'auteur valide avant la mise en page.
step: 2
step_label: Direction artistique
providers: [llm]
llm: { provider: provider, model: model }
job_steps: [art_direction]
knowledge_role: art_direction   # savoir-faire livré : presets/knowledge.yaml › agents.art_direction
summary: [provider, model]
secrets:
  - { env: DEEPSEEK_API_KEY, label: Clé d'API DeepSeek }
settings:
  - key: provider
    label: Fournisseur LLM
    group: Modèle
    type: choice
    choices: [deepseek, ollama, claude, mock]
    choice_labels: { deepseek: DeepSeek, ollama: Ollama (local), claude: Claude, mock: Factice (mode mock) }
    source: env:LLM_PROVIDER
    fallback: mock
    help: Ollama et Claude sont prévus mais pas encore disponibles.
  - key: model
    label: Modèle
    group: Modèle
    type: text
    source: providers.yaml#deepseek.model
    env_override: DEEPSEEK_MODEL
    help: Nom du modèle chez le fournisseur (ex. deepseek-chat).
  - key: temperature
    label: Température
    group: Modèle
    type: number
    min: 0
    max: 2
    step: 0.05
    source: prompts/direction-artistique.yaml#temperature
    help: 0 = réponses très régulières, 1 et plus = plus d'invention.
  - key: variety
    label: Audace
    group: Direction
    type: choice
    choices: [sobre, equilibree, audacieuse]
    choice_labels:
      sobre: Sobre (lisibilité d'abord)
      equilibree: Équilibrée
      audacieuse: Audacieuse (cadrages marqués, pages choc)
    source: prompts/direction-artistique.yaml#variety
    fallback: equilibree
    help: Plus l'audace est grande, plus l'agent ose les plans marqués, les cases sans bord et les pages choc.
  # Règles de mise en scène variée (variety_rules, vérifiées sur chaque réponse : une règle enfreinte relance
  # l'agent, puis la proposition est gardée avec un avertissement).
  - key: max_same_plan_in_a_row
    label: Cases d'affilée au même plan
    group: Mise en scène
    type: integer
    min: 1
    max: 20
    source: prompts/direction-artistique.yaml#variety_rules.max_same_plan_in_a_row
    help: Dans une page, au plus ce nombre de cases d'affilée au même plan.
  - key: max_same_angle_in_a_row
    label: Cases d'affilée au même angle
    group: Mise en scène
    type: integer
    min: 1
    max: 20
    source: prompts/direction-artistique.yaml#variety_rules.max_same_angle_in_a_row
    help: Dans une page, au plus ce nombre de cases d'affilée au même angle.
  - key: max_frontal_share
    label: Part maximale de cases de face
    group: Mise en scène
    type: number
    min: 0
    max: 1
    step: 0.05
    source: prompts/direction-artistique.yaml#variety_rules.max_frontal_share
    help: Sur les pages dirigées ensemble (0,35 = 35 % ; une case de face reste toujours permise).
  - key: min_off_eye_level_per_page
    label: Cases hors hauteur d'œil par page
    group: Mise en scène
    type: integer
    min: 0
    max: 20
    source: prompts/direction-artistique.yaml#variety_rules.min_off_eye_level_per_page
    help: Au moins ce nombre de cases en plongée, contre-plongée ou cadre penché par page (0 = pas d'exigence).
  - key: max_wide_medium_share
    label: Part maximale de plans larges et moyens
    group: Mise en scène
    type: number
    min: 0
    max: 1
    step: 0.05
    source: prompts/direction-artistique.yaml#variety_rules.max_wide_medium_share
    help: >-
      Plan large, plan d'ensemble et plan moyen (personnages en pied) sur les pages dirigées ensemble
      (0,5 = 50 % ; 1 = pas de limite).
  - key: min_tight_per_page
    label: Plans serrés par page
    group: Mise en scène
    type: integer
    min: 0
    max: 20
    source: prompts/direction-artistique.yaml#variety_rules.min_tight_per_page
    help: >-
      Au moins ce nombre de gros plans, très gros plans, plans rapprochés ou inserts par page de 3 cases
      ou plus (0 = pas d'exigence).
  - key: max_wide_in_a_row
    label: Plans larges d'affilée
    group: Mise en scène
    type: integer
    min: 1
    max: 20
    source: prompts/direction-artistique.yaml#variety_rules.max_wide_in_a_row
    help: Dans une page, au plus ce nombre de plans larges (ou d'ensemble) d'affilée.
  # Règles par planche (page_rules, vérifiées après la réponse : une relance ciblée sur les cases fautives,
  # puis un avertissement, jamais un blocage).
  - key: min_close_per_page
    label: Gros plans par page
    group: Mise en scène
    type: integer
    min: 0
    max: 20
    source: prompts/direction-artistique.yaml#page_rules.min_close_per_page
    help: >-
      Au moins ce nombre de gros plans, très gros plans ou inserts par page de 3 cases ou plus (0 = pas
      d'exigence).
  - key: min_calm_per_page
    label: Cases calmes par page
    group: Mise en scène
    type: integer
    min: 0
    max: 20
    source: prompts/direction-artistique.yaml#page_rules.min_calm_per_page
    help: >-
      Au moins ce nombre de cases d'intensité « calme » par page de 3 cases ou plus, même en plein combat
      (0 = pas d'exigence).
  - key: max_choc_in_a_row
    label: Cases « choc » d'affilée
    group: Mise en scène
    type: integer
    min: 0
    max: 50
    source: prompts/direction-artistique.yaml#page_rules.max_choc_in_a_row
    help: Sur le chapitre, au plus ce nombre de cases « choc » d'affilée (0 = pas de limite).
  - key: targeted_retry
    label: Relance ciblée des règles par planche
    group: Mise en scène
    type: integer
    min: 0
    max: 1
    source: prompts/direction-artistique.yaml#page_rules.targeted_retry
    help: >-
      1 = une relance qui ne corrige que les cases fautives (gros plan, case calme, composition répétée,
      chocs d'affilée, sujet relégué au fond) ; 0 = avertissement direct.
  - key: max_retries
    label: Nouveaux essais après une réponse invalide
    group: Modèle
    type: integer
    min: 0
    max: 2
    source: prompts/direction-artistique.yaml#max_retries
  - key: system
    label: Consignes système
    group: Prompts
    type: prompt
    source: prompts/direction-artistique.yaml#system
    variables: &da_vars
      - series_title
      - style_packs
      - style_guidelines
      - series_style
      - reading_direction
      - layout_style
      - layout_styles
      - characters
      - decors
      - objets
      - lieux
      - chapter_number
      - chapter_title
      - synopsis
      - summary
      - pages
      - previous_direction
      - variety
      - request
      - rythmes
      - intensities
      - plans
      - angles
      - cadres
      - page_chocs
      - sfx_intensities
      - variety_rules
      - page_rules
      - pre_direction
      - scene
      - context_json
      - bible
      - savoir_faire
  - key: user
    label: Gabarit du chapitre
    group: Prompts
    type: prompt
    source: prompts/direction-artistique.yaml#user
    variables: *da_vars
    help: Gardez le bloc <contexte>$context_json</contexte> pour le mode mock.
  - key: retry
    label: Consigne de relance
    group: Prompts
    type: prompt
    source: prompts/direction-artistique.yaml#retry
    variables: [error]
