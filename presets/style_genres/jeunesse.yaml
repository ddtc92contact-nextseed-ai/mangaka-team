# Genre « jeunesse » (kodomo) — champs : voir presets/README.md (« Packs de style »).
id: jeunesse
name: Jeunesse
description: Enfantin (kodomo) — histoires simples, personnages ronds et attachants. Pas de ton dark.
order: 40
lang: fr
prompt_keywords: [manga pour enfants, style simple et mignon, tout public]
reading_direction: rtl
fonts: { dialogue: fredoka, shout: titan-one }
# Planche de style : scène test des essais (français, aucun personnage de la série).
scene_test: >-
  deux enfants anonymes et un petit chat jouent au cerf-volant dans un parc ensoleillé, arbres ronds et nuages moelleux
llm_guidelines: >-
  Jeunesse, enfants de 6 à 10 ans : rythme simple et lisible, 3 à 5 cases par page, une action par
  case. Phrases courtes, vocabulaire adapté à l'âge, aucune violence graphique ni peur durable ;
  humour bienveillant et fin rassurante.
# Pas de ton « dark » pour les enfants.
allowed_tones: [lumineux, neutre, humour]
