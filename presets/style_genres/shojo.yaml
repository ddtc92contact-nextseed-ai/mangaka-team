# Genre « shōjo » — champs : voir presets/README.md (« Packs de style »).
id: shojo
name: Shōjo
description: Romance et émotions — sentiments intérieurs, relations, regards.
order: 30
lang: fr
prompt_keywords: [manga shojo, style romantique, grands yeux, traits fins et fleuris]
layout_style: sage
reading_direction: rtl
fonts: { dialogue: fredoka, shout: lilita-one }
# Planche de style : scène test des essais (français, aucun personnage de la série).
scene_test: >-
  une lycéenne anonyme regarde par la fenêtre d'une salle de classe, pétales de cerisier qui volent, lumière douce de fin d'après-midi
llm_guidelines: >-
  Shōjo, public adolescent : rythme centré sur les émotions, 4 à 6 cases par page, gros plans sur les
  visages et les regards, monologues intérieurs en récitatif ou en pensée. Dialogues sensibles,
  vocabulaire courant ; la relation entre les personnages porte le chapitre.
