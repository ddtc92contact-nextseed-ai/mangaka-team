fonts: { dialogue: fredoka, shout: lilita-one }
# Planche de style : scène test des essais (français, aucun personnage de la série).
scene_test: >-
  une jeune magicienne anonyme en costume à volants se transforme au sommet d'un pont la nuit, ruban de lumière et étoiles scintillantes autour d'elle
llm_guidelines: >-
  Magical girl, public adolescent : alternance de vie quotidienne et de combats magiques, 4 à 6 cases
