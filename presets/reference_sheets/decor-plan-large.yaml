# Type de fiche de référence : voir presets/README.md (« Fiches de référence »).
id: decor-plan-large
name: Plan large
description: "Le lieu en plan d'ensemble, vide de personnages, tel qu'on le découvre."
kinds: [decor]
order: 10
width: 1536
height: 864
# Palier Qualité (vrai CFG, non distillé) : le prompt négatif « aucune personne » est lu par le modèle.
workflow: qwen-image-base-qualite
prompt:
  - "Location reference sheet: $name as an establishing wide shot at eye level, the whole place visible."
  - "$description."
  - "Details: $keywords."
  - "Requested change: $instruction."
  - "$start is the starting image: keep the place, its layout and its elements, and redraw it cleanly as the sheet requires."
  - "Style: $style."
  - "The last image ($style_ref) is a style reference only (line work, screentones, inking): do not copy its character, scene or composition."
  - "No character, clear perspective, no text or readable sign."
negative_prompt: "person, people, human, character, figure, crowd, silhouette, animal, text, close-up"
