# Type de fiche de référence : voir presets/README.md (« Fiches de référence »).
id: objet-trois-quarts
name: Vue 3/4 + détails
description: "L'objet en vue de trois quarts, avec deux ou trois vues de détail autour."
kinds: [object]
order: 10
width: 1024
height: 1024
# Palier Qualité (vrai CFG, non distillé) : le prompt négatif « aucune personne » est lu par le modèle.
workflow: qwen-image-base-qualite
prompt:
  - "Object reference sheet: $name in three-quarter view, whole and centred, with two or three detail views in insets around it."
  - "$description."
  - "Details: $keywords."
  - "Requested change: $instruction."
  - "$start is the starting image: keep the object, its silhouette and proportions, and redraw it cleanly as the sheet requires."
  - "Style: $style."
  - "$subject."
  - "The last image ($style_ref) is a style reference only (line work, screentones, inking): do not copy its character, scene or composition."
  - "Plain white background, neutral studio lighting, no character, no text."
negative_prompt: "person, people, human, character, face, hands, figure, crowd, text, cluttered background"
