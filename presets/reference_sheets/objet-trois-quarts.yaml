id: objet-trois-quarts
name: Vue 3/4 + détails
description: "L'objet en vue de trois quarts, avec deux ou trois vues de détail autour."
kinds: [object]
order: 10
width: 1024
height: 1024
workflow: null
prompt:
  - "Fiche de référence d'objet : $name en vue de trois quarts, entier et centré, avec deux ou trois vues de détail en médaillon autour."
