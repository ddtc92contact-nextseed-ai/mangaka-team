# Type de fiche de référence : voir presets/README.md (« Fiches de référence »).
id: personnage-expressions
name: Expressions
description: "Grille de visages du même personnage : joie, colère, tristesse, surprise, peur, neutre."
kinds: [character]
order: 30
width: 1024
height: 1024
workflow: null
prompt:
  - "Expression sheet of $name: a grid of six faces of the same character, front view — neutral, joy, anger, sadness, surprise, fear."
  - "$description."
  - "Details: $keywords."
  - "Requested change: $instruction."
  - "$start is the starting image: keep the subject, the face and the hairstyle, and redraw them cleanly in each requested expression."
  - "Style: $style."
  - "$subject."
  - "The last image ($style_ref) is a style reference only (line work, screentones, inking): do not copy its character, scene or composition."
  - "Plain white background, same hairstyle and same face in every vignette, no text."
negative_prompt: "extra characters, background people, text, different faces, captions"
