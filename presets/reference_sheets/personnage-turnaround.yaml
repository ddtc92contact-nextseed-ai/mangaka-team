id: personnage-turnaround
name: Plein pied face / profil / dos (turnaround)
description: "Le même personnage en pied, vu de face, de profil et de dos, côte à côte."
kinds: [character]
order: 20
width: 1536
height: 864
workflow: null
prompt:
  - "Model sheet (turnaround) of $name: three full-body views of the same character side by side — front, side profile, back — same size, same outfit, neutral pose with arms along the body."
  - "$description."
  - "Details: $keywords."
  - "Requested change: $instruction."
  - "$start is the starting image: keep the subject, the silhouette and the outfit, and redraw them cleanly in the three requested views."
  - "Style: $style."
