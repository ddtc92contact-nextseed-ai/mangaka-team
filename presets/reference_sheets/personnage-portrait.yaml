# Type de fiche de référence (« Créer des références » de la bibliothèque) : voir presets/README.md.
# Ajouter un fichier ici suffit à proposer un nouveau type de fiche, sans toucher au code.
id: personnage-portrait
name: Portrait de face
description: "Buste de face, regard caméra, fond neutre : la référence principale du visage."
kinds: [character]
order: 10
# Plans de case que sert cette fiche (« Références par plan », pipeline/generation.py) : pour un plan serré,
# le portrait du personnage passe en tête de ses images — une référence plein pied tire la case vers le
# plein pied, quel que soit le plan écrit dans le prompt.
shots: [gros plan, très gros plan, plan rapproché, insert, plan moyen]
width: 1024
height: 1024
# null : palier des fiches (`workflow_library` de defaults.yaml : Turbo), sinon celui de la série,
# ou Qualité si l'auteur le demande. Un id de
# presets/workflows/ impose ce workflow (le choix du palier est alors ignoré).
workflow: null
# Morceaux assemblés dans l'ordre ; un morceau dont une variable est vide est omis.
# Variables : $name, $description, $keywords, $style, $instruction (consigne d'« Affiner »),
# $start (image de départ, si choisie), $style_ref (référence de style jointe, toujours la dernière image).
prompt:
  - "Character reference sheet: front portrait of $name, bust framed at shoulder height, looking at the viewer, neutral expression."
  - "$description."
  - "Details: $keywords."
  - "Requested change: $instruction."
  - "$start is the starting image: keep the subject, the silhouette and the pose, and redraw it cleanly as the sheet requires."
  - "Style: $style."
  - "The last image ($style_ref) is a style reference only (line work, screentones, inking): do not copy its character, scene or composition."
  - "Plain white background, even neutral lighting, a single character, no text."
negative_prompt: "extra characters, background people, text, multiple characters, cluttered background, profile view, back view"
