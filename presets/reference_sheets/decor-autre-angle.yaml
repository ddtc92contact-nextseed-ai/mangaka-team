# Type de fiche de référence : voir presets/README.md (« Fiches de référence »).
id: decor-autre-angle
name: Autre angle
description: "Le même lieu vu depuis le côté opposé, pour garder la cohérence des contrechamps."
kinds: [decor]
order: 20
width: 1536
height: 864
# Palier Qualité (vrai CFG, non distillé) : le prompt négatif « aucune personne » est lu par le modèle.
workflow: qwen-image-base-qualite
prompt:
  - "Location reference sheet: $name seen from another angle, from the opposite side of the room or street (reverse shot), medium-wide shot."
  - "$description."
  - "Details: $keywords."
  - "Requested change: $instruction."
  - "$start is the starting image: keep the place, its elements and materials, and redraw it cleanly from the requested angle."
  - "Style: $style."
  - "$subject."
  - "The last image ($style_ref) is a style reference only (line work, screentones, inking): do not copy its character, scene or composition."
  - "No character, same materials and same light as the establishing shot, no text."
negative_prompt: "person, people, human, character, figure, crowd, silhouette, animal, text, close-up"
