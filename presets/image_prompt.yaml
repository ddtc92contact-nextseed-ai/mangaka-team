# Construction du prompt final d'une case (étape 3, pipeline/prompt.py).
# Le prompt est stocké sur la case ; une édition manuelle est conservée tant qu'on ne
# demande pas de le reconstruire.
#
# Tout le texte côté image est en anglais (la langue de Qwen-Image 2.1, voir presets/README.md
# « Prompts en anglais ») ; ce que lit l'auteur (interface, scénario, dialogues) reste en français.
# Le prompt par fragments est le repli du rédacteur de prompt (prompts/redacteur-image.yaml) : ses
# gabarits sont anglais, mais la description, le lieu, la mise en scène et l'ambiance y entrent tels
# que le scénario les a écrits (seul le LLM les traduit).

# Morceaux assemblés dans l'ordre, séparés par une espace. Un morceau dont une variable
# est vide est omis. Variables : $shot (type de plan du scénario), $description (description de la
# case), $characters (personnages, voir `character`), $decor (décor récurrent de la case) et
# $objects (objets récurrents), décrits comme les personnages, $style (packs de style de la série :
# mots déclencheurs du LoRA, genre, rendu, ton, réglages fins — pipeline/style.py),
# $bible (notes de la bible sur les personnages de la case), $savoir_faire (passages des
# collections de l'agent « image_prompt », en une ligne, voir knowledge.yaml : budget_tokens serré —
# le rédacteur de prompt, lui, reçoit les passages entiers dans writer_budget_tokens).
# Direction artistique appliquée (onglet « Direction artistique » du chapitre) : $plan (son type de
# plan, sinon celui du scénario), $angle (angle de caméra) — tous deux traduits par `camera_terms` —,
# $ambiance (lumière, atmosphère), $action (mouvement ou pose du corps).
# Scénario : $setting (lieu de la case : lieu, moment, éléments du décor — présent même sans décor de la
# bibliothèque), $staging (mise en scène : qui fait quoi, où dans le cadre, interactions),
# $character_count (nombre de personnages en toutes lettres : « One character », « Two characters »).
# $style_lead : phrase de style de la série (`style_lead` ci-dessous), toujours en tête : sans image de
# référence (figurants, lieux, workflow texte), c'est elle qui tient le style manga (12/10/2026).
parts:
  - "$style_lead."
  - "$plan."
  - "Camera angle: $angle."
  - "$description."
  - "Action and pose: $action."
  - "Setting: $setting."
  - "Staging: $staging."
  - "Mood and lighting: $ambiance."
  - "Recurring setting: $decor."
  - "$character_count: $characters."
  - "Objects: $objects."
  - "Series bible notes: $bible."
  - "Style: $style."
  - "Style notes: $savoir_faire."
  # Aucune mention de rendu ici (« inked », « colour »…) : le pack de rendu de la série la donne dans $style.
  - "A single continuous scene in one panel, no text or speech bubbles in the image."

# Un personnage (et de même un décor ou un objet de la bibliothèque) : $name, $details (description visuelle + mots-clés de prompt).
character: "$name ($details)"
character_separator: "; "

# Le modèle d'image ne dessine jamais de texte (bulles et lettrage sont vectoriels) :
# ces termes sont toujours ajoutés au prompt négatif s'ils n'y sont pas déjà.
forbidden_text_terms: [text, letters, speech bubble, caption, onomatopoeia, watermark, signature]

# Contre le photoréalisme (12/10/2026) : seuls les personnages à image de référence sortaient en manga,
# figurants, lieux et cases sans référence sortaient en photo. Ces termes sont toujours ajoutés au prompt
# négatif s'ils n'y sont pas déjà (lu à vrai CFG seulement, palier Qualité) …
negative_photo_terms: [photorealistic, photograph, photo, 3d render, cgi, realistic skin texture, film grain]
# … et un paragraphe du rédacteur de prompt qui contient l'un de ces termes (mots entiers, sans casse,
# hors mots-clés de style de la série) est refusé puis redemandé : pour Qwen-Image, ce vocabulaire
# d'objectif et de photo est un fort déclencheur de photoréalisme.
forbidden_photo_terms:
  - photo
  - photograph
  - photographic
  - photorealistic
  - photorealism
  - realistic
  - lens
  - bokeh
  - depth of field
  - telephoto
  - DSLR
  - cinematic still
  - 35mm

# Phrase de style en tête de chaque prompt de case (fragments et rédacteur de prompt), avant même le rôle
# des images : morceaux joints par « , » et terminés par un point ; un morceau dont une variable est vide
# est omis. $rendering : `lead` du pack de rendu de la série (sinon son 1er mot-clé) ; $genre : 1er
# mot-clé du genre. Ex. « Black and white manga panel, inked line art with halftone screentone shading,
# seinen manga style. » Les mots-clés `$style` restent en fin de prompt.
style_lead:
  - "$rendering"
  - "$genre style"

# Longueur maximale de $style (caractères, séparateurs compris ; null = sans plafond). Le bloc « Style »
# pesait ~1/3 du prompt et noyait la description de la case : les packs y entrent tour à tour (1er
# mot-clé de chaque pack, puis le 2e…, le rendu en premier à chaque tour), sans doublon. Les mots-clés
# calibrés des packs ne changent pas, seule leur sélection (pipeline/style.py).
style_max_chars: 240

# Retire de la description les répliques entre guillemets (« … », "…") pour ne pas
# inciter le modèle à les écrire.
strip_quotes: true

# Cadrage des images de référence (workflows avec références : edit-ref…), ajouté au prompt envoyé à
# ComfyUI au moment de la génération (le prompt final de la case ne change pas). Syntaxe de Qwen-Image
# 2.1 Edit : chaque image est citée par <image1>, <image2>… et son rôle est défini en tête du prompt.
# Sans ce cadrage, le modèle d'édition reprend l'image telle quelle : planche de poses, portrait de face
# sur fond blanc. Un prompt rédigé par l'IA qui définit déjà ces rôles en tête ne reçoit que `after`.
references:
  # Une ligne par image envoyée, dans l'ordre des emplacements : $slot (1, 2, 3), $name (nom de la fiche).
  character: "<image$slot> is the identity reference for $name: keep the face, hair, outfit and colours; ignore its pose, framing and background."
  decor: "<image$slot> is the location reference for $name: keep its layout, architecture and materials; show it from the new camera angle."
  object: "<image$slot> is the design reference for the object $name: keep its shape, colours and details."
  style: "<image$slot> is a style reference only (line work, inking, screentones, colours): do not copy its characters, scene or composition."
  # Consigne de tri de chaque image envoyée ($sorting, dans l'ordre des emplacements) : ce qu'il faut en
  # prendre, et ce qu'il faut ignorer de la planche (mise en page, grille de poses, règles, étiquettes,
  # fond blanc), que le modèle recopie sinon. Toujours ajoutée, même à un prompt rédigé par l'IA
  # (elle est dans `after`). $slot, $name comme ci-dessus ; vide = pas de consigne pour cette sorte.
  sorting:
    character: "From <image$slot> take only the face, hair, body and outfit of $name; ignore its layout, pose grid, rules, labels and white background."
    decor: "From <image$slot> take only the shape, architecture, materials and details of the location $name; ignore its layout, framing, labels and any people."
    object: "From <image$slot> take only the shape and details of the object $name; ignore its layout, rules, labels and white background."
    style: "From <image$slot> take only the rendering (line work, inking, screentones, colours); never take its characters or its scene."
  separator: " "
  # Morceaux avant / après le prompt de la case : $images (les lignes ci-dessus), $count (nombre d'images),
  # $sorting (les consignes de tri ci-dessus).
  before:
    - "$images"
  after:
    - "$sorting"
    - "Use the reference images for identity and design only (face, hair, body shape, outfit, colours, materials): draw a new scene with new poses, a new camera angle and the whole background described above, everything (extras and places included) drawn in the same manga style as the reference images. Exactly one continuous scene in a single panel: not a character sheet, not a turnaround, not a collage, no side-by-side views, no multiple poses, no plain white background."
  # Série en noir et blanc (`monochrome: true` du pack de rendu, 13/10/2026) : ces lignes remplacent celles
  # ci-dessus (une clé absente garde la ligne ci-dessus). « colours » des fiches poussait Qwen-Image vers la
  # couleur et le lavis gris (33 cases sur 34 au chapitre 3). Le rédacteur de prompt cite les mêmes rôles.
  monochrome:
    character: "<image$slot> is the identity reference for $name: keep the face, hair and outfit; ignore its pose, framing and background."
    object: "<image$slot> is the design reference for the object $name: keep its shape and details."
    style: "<image$slot> is a style reference only (line work, inking, screentones): do not copy its characters, scene or composition."
    sorting:
      style: "From <image$slot> take only the rendering (line work, inking, screentones); never take its characters or its scene."
    after:
      - "$sorting"
      - "Use the reference images for identity and design only (face, hair, body shape, outfit, materials): draw a new scene with new poses, a new camera angle and the whole background described above, everything (extras and places included) drawn in the same manga style as the reference images. Exactly one continuous scene in a single panel: not a character sheet, not a turnaround, not a collage, no side-by-side views, no multiple poses, no plain white background."

# Série en noir et blanc (13/10/2026) : la case 96 demandait « the thick green liquid » et sortait avec une
# coulée verte (saturation 0,13 à 0,19 ; 0,03 sans les mots de couleur). Ces termes sont retirés du prompt
# positif AU MOMENT DE L'ENVOI à ComfyUI (prompts déjà stockés compris : « the thick green liquid » → « the
# thick liquid »), mots entiers, sans casse, les plus longs d'abord ; un terme contenu dans le nom d'un
# personnage, d'un décor ou d'un objet de la case reste. Un paragraphe du rédacteur de prompt qui en contient
# est refusé puis redemandé (comme forbidden_photo_terms), et ils sont retirés des données qu'il reçoit.
# Jamais « black », « white » ni « grey » : ce sont les valeurs du noir et blanc ; ni les matières (« gold »,
# « bronze », « copper ») ni les mots à double sens (« rose », « olive », « navy »).
monochrome_forbidden_terms:
  # couleur en général
  - colours
  - colors
  - colour
  - color
  - coloured
  - colored
  - colourful
  - colorful
  - multicoloured
  - multicolored
  - full colour
  - full color
  - vibrant colours
  - vibrant colors
  - vivid colours
  - vivid colors
  - colour palette
  - color palette
  - warm colour palette
  - warm color palette
  - cool colour palette
  - cool color palette
  - warm tones
  - cool tones
  - pastel
  - pastels
  - pastel colours
  - pastel colors
  - saturated
  - golden hour
  # noms de couleur
  - red
  - reddish
  - crimson
  - scarlet
  - blue
  - bluish
  - azure
  - cyan
  - turquoise
  - teal
  - green
  - greenish
  - emerald
  - yellow
  - yellowish
  - golden
  - amber
  - orange
  - purple
  - violet
  - lilac
  - lavender
  - magenta
  - pink
  - brown
  - beige
  # français (descriptions de cases et fiches non traduites du prompt par fragments)
  - couleur
  - couleurs
  - coloré
  - colorée
  - colorés
  - colorées
  - rouge
  - rouges
  - bleu
  - bleue
  - bleus
  - bleues
  - vert
  - verte
  - verts
  - vertes
  - jaune
  - jaunes
  - doré
  - dorée
  - dorés
  - dorées
  - orangé
  - orangée
  - violette
  - violets
  - violettes
  - pourpre
  - écarlate
  - marron
# Toujours ajoutés au prompt négatif d'une série en noir et blanc (lu à vrai CFG seulement, palier Qualité).
monochrome_negative_terms: [color, colored, colorful]
# Règle ajoutée aux consignes du rédacteur de prompt pour une série en noir et blanc ($palette_rule de
# prompts/redacteur-image.yaml ; vide pour une série en couleur).
monochrome_writer_rule: >-
  - the panel is black and white: never write a colour word (red, blue, green, golden, colourful, pastel,
  colour palette…), describe light and matter only in ink, black, white, grey screentone and paper, or the
  answer is rejected;

# Ambiance de la case contre ton de la série (13/10/2026) : le ton « lumineux » envoyait « bright joyful
# atmosphere, warm light » jusqu'à la case où un trafiquant blêmit de terreur. Quand l'ambiance de la case
# (direction artistique) contient l'un des `moods` (sans casse ni accents, mots entiers ; « angoiss* » :
# tout mot qui commence ainsi), les mots-clés `drop` sont retirés du style de cette case et du prompt envoyé
# à ComfyUI (prompts déjà stockés compris). L'ambiance de la case gagne toujours sur le ton de la série.
mood_conflicts:
  - name: peur, tension, tristesse, colère, menace
    moods:
      - peur
      - apeuré*
      - terreur
      - terrifi*
      - terroris*
      - effroi
      - effray*
      - épouvant*
      - horreur
      - horrifi*
      - angoiss*
      - panique*
      - affolé*
      - tension
      - tendu*
      - suspense
      - inquiet*
      - inquiét*
      - anxi*
      - menace*
      - menaç*
      - danger*
      - sinistre
      - oppress*
      - triste*
      - chagrin
      - deuil
      - larme*
      - pleur*
      - désespoir
      - désespér*
      - mélancoli*
      - colère
      - furieu*
      - fureur
      - rage
      - haine
      - fear*
      - afraid
      - scared
      - terror
      - terrified
      - dread
      - horror
      - panic*
      - tense
      - anxious
      - menac*
      - threat*
      - ominous
      - sad
      - sadness
      - sorrow*
      - grief
      - despair
      - tears
      - anger
      - angry
      - fury
      - furious
    drop: [bright joyful atmosphere, warm light, smiles, smiling, smile, joyful, cheerful, neutral calm atmosphere, no strong emotion]
  - name: joie
    moods: [joie, joyeu*, heureu*, bonheur, rire, rires, rieur*, fête, festi*, gai, gaie, gaieté, euphori*, joy, joyful, happy, happiness, cheerful, laughter, laughing, celebrat*]
    drop: [dark dramatic atmosphere]

# Plans et angles (direction artistique, scénario) → termes de cadrage anglais ($shot, $plan, $angle et
# le rédacteur de prompt). Jamais de vocabulaire d'objectif ou de photo (forbidden_photo_terms) : cadrage
# et angle seulement. Clés comparées sans casse ; une valeur absente passe telle quelle.
# Chaque plan serré dit où le cadre coupe le corps (12/10/2026) : « medium shot » seul laissait Qwen-Image
# dessiner les personnages en pied, surtout avec une référence plein pied.
camera_terms:
  plan large: wide shot
  plan d'ensemble: establishing extreme wide shot
  plan moyen: medium shot, framed from the waist up, legs out of frame
  plan américain: medium-long shot (cowboy shot, framed from mid-thigh up, feet out of frame)
  plan rapproché: medium close-up, head and shoulders, framed from the chest up
  gros plan: close-up, the face fills the frame, shoulders cut by the frame edge
  très gros plan: extreme close-up, a part of the face (eyes, mouth) fills the whole frame
  insert: insert shot (extreme close-up on a detail that fills the frame)
  plongée: high-angle shot
  contre-plongée: low-angle shot
  de face: frontal view at eye level
  de trois quarts: three-quarter view
  de profil: side profile view
  de dos: view from behind, over-the-shoulder
  en plongée: high-angle view looking down
  en contre-plongée: low-angle view looking up
  vue subjective: point-of-view shot (first-person perspective)
  cadre penché: dutch angle (tilted frame)
  vue aérienne: bird's-eye view

# Plans plus serrés que le plan américain : termes ajoutés au prompt négatif de la case (contre le plein
# pied). Avec cfg 1 (Turbo, Rapide, croquis) le négatif n'est pas lu : la phrase de cadrage du prompt
# positif (camera_terms ci-dessus, reprise par le rédacteur de prompt) reste le levier principal.
tight_shots:
  shots: [plan moyen, plan rapproché, gros plan, très gros plan, insert]
  negative: [full body, full-length, feet visible, standing pose facing viewer]
