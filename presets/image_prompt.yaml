# Construction du prompt final d'une case (étape 3, pipeline/prompt.py).
# Le prompt est stocké sur la case ; une édition manuelle est conservée tant qu'on ne
# demande pas de le reconstruire.

# Morceaux assemblés dans l'ordre, séparés par une espace. Un morceau dont une variable
# est vide est omis. Variables : $shot (type de plan du scénario), $description (description de la
# case), $characters (personnages, voir `character`), $decor (décor récurrent de la case) et
# $objects (objets récurrents), décrits comme les personnages, $style (packs de style de la série :
# mots déclencheurs du LoRA, genre, rendu, ton, réglages fins — pipeline/style.py),
# $bible (notes de la bible sur les personnages de la case), $savoir_faire (passages des
# collections de l'agent « image_prompt », voir knowledge.yaml ; budget de jetons serré).
# Direction artistique appliquée (onglet « Direction artistique » du chapitre) : $plan (son type de
# plan, sinon celui du scénario), $angle (angle de caméra), $ambiance (lumière, atmosphère).
parts:
  - "$plan."
  - "Angle de caméra : $angle."
  - "$description."
  - "Ambiance : $ambiance."
  - "Décor : $decor."
  - "Personnages : $characters."
  - "Objets : $objects."
  - "Repères de la bible : $bible."
  - "Style : $style."
  - "Notes de style : $savoir_faire."
  # Aucune mention de rendu ici (« encré », « couleur »…) : le pack de rendu de la série la donne dans $style.
  - "Aucun texte ni bulle dans l'image."

# Un personnage (et de même un décor ou un objet de la bibliothèque) : $name, $details (description visuelle + mots-clés de prompt).
character: "$name ($details)"
character_separator: " ; "

# Le modèle d'image ne dessine jamais de texte (bulles et lettrage sont vectoriels) :
# ces termes sont toujours ajoutés au prompt négatif s'ils n'y sont pas déjà.
forbidden_text_terms: [texte, lettres, bulles, phylactères, onomatopées, filigrane, signature]

# Retire de la description les répliques entre guillemets (« … », "…") pour ne pas
# inciter le modèle à les écrire.
strip_quotes: true
