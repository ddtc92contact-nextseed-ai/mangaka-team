# Savoir-faire injecté dans les agents (RAG local) : découpage des documents, recherche hybride
# (vecteurs + mots-clés FTS5) et collections lues par chaque agent.
#
# Le modèle d'embeddings est dans providers.yaml (ollama.embedding_model) ; EMBEDDING_PROVIDER=mock|ollama
# dans .env. Les jetons sont estimés (≈ 4 caractères par jeton), sans tokenizer.

chunking:
  max_tokens: 350        # taille maximale d'un passage (découpe aux titres, puis aux paragraphes)
  min_tokens: 40         # un passage plus court est fusionné au suivant de la même section
  # Fiche d'un pack (presets/knowledge_packs/) : une fiche = un passage. Seule une fiche plus longue est coupée,
  # et son fragment « Prompt (EN) » reste dans le dernier passage, avec le titre de la fiche.
  fiche_max_tokens: 800

retrieval:
  top_k: 6               # passages au plus, par défaut (surchargé par agent)
  vector_weight: 0.6     # score hybride = 0,6 × similarité cosinus + 0,4 × score mots-clés (BM25 normalisé)
  keyword_weight: 0.4
  min_score: 0.05        # passages sous ce score : écartés

# Petite collection (moins de jetons que ce seuil) : injectée entière au lieu d'une recherche.
small_collection_tokens: 1200

# Bible de série : toujours injectée dans les agents de la série. Au-delà de ce budget, les plus
# anciens résumés de chapitres sont retirés en premier.
bible_max_tokens: 2500

# Collections lues par agent (noms des collections, sans tenir compte de la casse). Si l'agent a
# un profil avec un champ « Savoir-faire » (écran « L'équipe »), le profil prime sur cette liste.
# series_collections : ajoute les collections rattachées à la série du chapitre (jamais celles d'une autre série).
#
# Les collections « Mise en scène · … » viennent du pack livré presets/knowledge_packs/manga_visual_knowledge
# (importé au démarrage, « Mettre à jour les packs » dans Savoir-faire). « Pont ComfyUI » est une petite
# collection (moins de small_collection_tokens) : injectée entière. « Vocabulaire » et « Checklist » décrivent
# le format de sortie d'un storyboarder (champs que l'appli n'a pas) : lues par aucun agent, mais toujours
# consultables et cherchables dans Savoir-faire.
#
# Les collections « Rendu · … » viennent du pack presets/knowledge_packs/manga_rendering_knowledge (encrage,
# trames, papier, finitions, valeurs). Branchement étroit (13/10/2026) : le budget du rédacteur de prompt est
# déjà plein sur chaque case. Directeur artistique : Valeurs et masses + Encrage ; rédacteur de prompt : Valeurs
# et masses SEULEMENT ; scénariste : rien. Trames, Papier et impression, Finitions : cherchables dans
# Savoir-faire, lues par aucun agent (la finition se règle sur la fiche de la série, style_options.yaml).
#
# Les collections « Structure · … » viennent du pack presets/knowledge_packs/manga_story_structure (14/10/2026 :
# déroulé d'un chapitre, courbes de tension par genre, plans selon le moment, fins de chapitre, rythme d'un arc,
# silence et dialogue). Lues par le scénariste seulement (le futur agent de création de série les recevra aussi) ;
# petites, elles sont cherchées et jamais injectées entières (comme toute collection d'un pack chez le scénariste).
agents:
  script:
    label: Scénariste (étape 1)
    collections:
      - Écriture de scénario
      - Rythme et découpage
      - Humour jeunesse
      - Mise en scène · Fondamentaux
      - Mise en scène · Émotions
      - Mise en scène · Exemples
      - Structure · Déroulé du chapitre
      - Structure · Courbes par genre
      - Structure · Plans selon le moment
      - Structure · Fins de chapitre
      - Structure · Rythme d'un arc
      - Structure · Silence et dialogue
    series_collections: true
    budget_tokens: 2500
    top_k: 6
    # Ajouté à la requête (titre, synopsis, packs de style) : le synopsis ne parle jamais de déroulé ni de fin.
    query_hint: Déroulé, accroche, pic, fin
  # Savoir-faire cherché page par page (requête : le scénario de la page), dans ce budget total, sans doublon ;
  # top_k : fiches au plus par page. Une petite collection d'un pack n'est jamais injectée entière ici.
  art_direction:
    label: Directeur artistique (avant l'étape 2)
    collections:
      - Mise en page
      - Rythme et découpage
      - Mise en scène · Fondamentaux
      - Mise en scène · Cadrages
      - Mise en scène · Angles
      - Mise en scène · Action
      - Mise en scène · Composition
      - Mise en scène · Découpage
      - Mise en scène · Émotions
      - Mise en scène · Anti-répétition
      - Mise en scène · Exemples
      - Rendu · Valeurs et masses
      - Rendu · Encrage
    series_collections: true
    budget_tokens: 3500
    top_k: 5
  # Deux budgets coupés dans la même recherche : le rédacteur de prompt (LLM, rédaction automatique et
  # « Dialogue ») lit les passages entiers avec leur source ; le prompt par fragments (repli quand le
  # rédacteur est désactivé ou en panne, `$savoir_faire` d'image_prompt.yaml) garde une note courte en
  # une ligne, pour ne jamais coller de théorie en français dans le prompt du modèle d'image.
  # Le budget et le top-k réglés dans « L'équipe » (Dessinateur) sont ceux du rédacteur.
  # Les fiches d'un pack ne vont qu'au rédacteur : jamais dans la note courte des fragments (prompt du modèle
  # d'image). Pont ComfyUI (≈ 420 jetons) est injectée entière dans le budget du rédacteur.
  image_prompt:
    label: Prompts image (étape 3)
    collections:
      - Design de personnages
      - Mise en page
      - Mise en scène · Cadrages
      - Mise en scène · Angles
      - Mise en scène · Corps et gestes
      - Mise en scène · Action
      - Mise en scène · Composition
      - Mise en scène · Émotions
      - Mise en scène · Pont ComfyUI
      - Rendu · Valeurs et masses
    # ≈ 680 jetons : sous small_collection_tokens, elle serait injectée entière et, avec Pont ComfyUI (≈ 420),
    # mangerait le budget du rédacteur (plus de fiche de cadrage). Cherchée : ses fiches utiles à la case seulement.
    searched_collections:
      - Rendu · Valeurs et masses
    series_collections: true
    budget_tokens: 160            # fragments : note courte du prompt d'une case
    top_k: 2
    bible_max_tokens: 120         # fragments : notes de la bible sur les personnages de la case
    writer_budget_tokens: 1200    # rédacteur : passages entiers, avec leur source
    writer_top_k: 5
    writer_bible_max_tokens: 400  # rédacteur : notes de la bible sur les personnages de la case
