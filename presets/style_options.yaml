# Réglages fins du style d'une série : listes bornées, chacune avec ses mots-clés et leur langue (`lang`).
# Mots-clés en anglais depuis le 11/10/2026 (langue de Qwen-Image 2.1, voir presets/README.md « Prompts en anglais »).
# Calibrage du 10/10/2026 : voir presets/README.md (« Calibrage »). Un niveau « moyen » nomme sa position.
# Un réglage non choisi n'ajoute rien au prompt. Ordre des réglages = ordre dans le prompt.
# Champs : voir presets/README.md (« Packs de style »).
options:
  # Dessin des personnages (14/10/2026) : « Épuré » REMPLACE au lieu d'ajouter. Mesuré sur le projet 3 (seinen,
  # N&B à trames, 14 générations, code de l'appli) : la chaîne complète + des mots épurés ajoutés sort très
  # détaillée (P1) ; la même chaîne où les mots de détail sont remplacés sort épurée (P2). Champs :
  # - `replaces` : mots-clés retirés de `$style` (genre, rendu, ton, autres réglages) et des morceaux de la
  #   phrase de style (`lead` du rendu, coupé aux virgules) ; les mots-clés du choix passent en tête des packs,
  #   juste après les mots déclencheurs du LoRA (la recette mesurée part entière) ;
  # - `{text: …, monochrome: true}` : mot-clé gardé seulement sur un rendu N&B (papier blanc, trames grises) ;
  # - `subject_keywords` : mots anti-détail génériques ajoutés au prompt positif des fiches ($subject) et des cases
  #   ($finition), hors `$style` — une fois la chaîne épurée, la description reprend la main (« combinaison style
  #   mechatronique » ramenait des panneaux d'armure) ;
  # - `negative_keywords` : ajoutés au prompt négatif des fiches et des cases, lu au palier Qualité seulement.
  # « Détaillé (genre) » (ou « Par défaut ») : rien ne change, `$style` identique octet pour octet.
  # L'image de départ fige le rendu : une fiche créée avant le passage en Épuré garde son trait, et ses variantes
  # aussi (« Refaire la base en épuré » sur la fiche, sans image de départ).
  dessin:
    name: Dessin des personnages
    description: >-
      Épuré : traits fins et simples, peu de détails, pour que la série ne ressemble pas aux autres. Détaillé :
      le dessin du genre (rendu actuel).
    choices:
      detaille:
        name: Détaillé (genre)
        lang: en
        prompt_keywords: []
      epure:
        name: Épuré
        lang: en
        prompt_keywords:
          - clean simple manga line art
          - thin uniform black outlines
          - { text: flat white paper, monochrome: true }
          - { text: a few flat grey screentone areas, monochrome: true }
          - no shading
          - no gradients
          - no hatching
          - minimal detail
          - simplified facial features
          - { text: large empty white areas, monochrome: true }
          - uncluttered
        replaces:
          # genre
          - mature detailed ink style
          - delicate flowery linework
          # rendu (mots-clés et morceaux de la phrase de style)
          - halftone screentone dots
          - regular grey dot pattern
          - cross-hatching
          - cel shading
          - hand-drawn inked line art with halftone screentone shading
          - hand-drawn inked line art with cross-hatching and solid blacks
          # réglages fins
          - thick bold linework
          - heavy inking
          - medium-density halftone dot screentone
          - medium grey
          - dense dark screentone
          - many intricate details
        subject_keywords:
          - plain smooth untextured surfaces
          - no mechanical panel lines
          - no rivets
          - no greebles
        negative_keywords:
          - mechanical panel lines
          - rivets
          - sci-fi greebles
          - intricate details
          - cross-hatching
  trait:
    name: Trait
    description: Épaisseur du trait d'encrage.
    choices:
      fin: { name: Fin, lang: en, prompt_keywords: [thin linework, delicate lines] }
      moyen: { name: Moyen, lang: en, prompt_keywords: [manga, medium line weight (between thin and thick), moderate inking] }
      epais: { name: Épais, lang: en, prompt_keywords: [thick bold linework, heavy inking] }
  trames:
    name: Trames
    description: Densité des trames (rendus noir et blanc seulement).
    monochrome_only: true
    choices:
      legeres: { name: Légères, lang: en, prompt_keywords: [light screentone, subtly grey] }
      moyennes: { name: Moyennes, lang: en, prompt_keywords: [manga, medium-density halftone dot screentone, medium grey] }
      denses: { name: Denses, lang: en, prompt_keywords: [dense dark screentone] }
  detail:
    name: Détail des décors
    description: Niveau de détail des arrière-plans.
    choices:
      simple: { name: Simple, lang: en, prompt_keywords: [uncluttered background, few details] }
      moyen: { name: Moyen, lang: en, prompt_keywords: [moderately detailed background] }
      riche: { name: Riche, lang: en, prompt_keywords: [richly detailed background, many intricate details] }
  # Finition : la partie « canaliser le style sans LoRA » (13/10/2026) — les mots de la finition partent dans
  # CHAQUE case de la série. `piece: finition` : ils vont dans la pièce réservée `$finition` d'image_prompt.yaml,
  # juste après la phrase de style, et JAMAIS dans `$style` (plafonné à `style_max_chars`, il les tronquerait en
  # silence et chasserait les mots du genre et du ton). `negative_keywords` : ajoutés au prompt négatif de la
  # case, lu seulement à vrai CFG (cfg > 1, palier Qualité) ; en Turbo, Rapide et croquis (cfg 1), seuls les
  # mots-clés du prompt positif portent la finition.
  # Recettes mesurées le 13/10/2026 (ecoloman ch.1 case 11, graine 880101, palier Qualité, cfg 2,0) — densité de
  # trait (écart moyen entre pixels voisins du visage) : référence 23,1 · croquis 26,6 (la vision le classe
  # « ARTISANAL ») · pinceau nerveux 24,6 · scan 32,4 (+40 %). Une seule case (gros plan) : à confirmer sur un
  # décor et une case d'action. Fiches « Rendu · Finitions » du pack manga_rendering_knowledge.
  # Pas monochrome_only : un croquis peut servir une série en couleur (papier et scan mesurés en N&B).
  finition:
    name: Finition
    description: >-
      Aspect du dessin : propre (rendu actuel) ou fait main — croquis visible, pinceau nerveux, scan
      d'impression des années 90. Ajouté à chaque case de la série, juste après la phrase de style.
    piece: finition
    choices:
      propre:
        name: Propre (rendu actuel)
        lang: en
        prompt_keywords: []
      croquis:
        name: Croquis visible
        lang: en
        prompt_keywords:
          - rough hand-drawn ink sketch
          - visible pencil underdrawing
          - unclosed lines
          - quick loose strokes
          - the artist's hand is visible
          - deliberately unfinished
        negative_keywords:
          - clean digital line art
          - smooth vector lines
          - glossy airbrush
          - over-rendered
          - polished 3d render
          - perfect gradients
          - slick illustration
      pinceau-nerveux:
        name: Pinceau nerveux
        lang: en
        prompt_keywords:
          - confident rough brush inking
          - dry brush strokes
          - ink splatter
          - rough hatching
          - visible stroke ends
          - uneven ink density
      scan:
        name: Scan années 90
        lang: en
        prompt_keywords:
          - printed on cheap paper
          - coarse halftone dots
          - paper grain
          - off-white paper
          - faint ghosting
          - slight ink misregistration
        negative_keywords:
          - clean digital line art
          - smooth vector lines
          - glossy airbrush
          - over-rendered
          - polished 3d render
          - perfect gradients
          - slick illustration
