# Rendu « N&B à trames » (par défaut) — champs : voir presets/README.md (« Packs de style »).
# Mots-clés recalibrés le 10/10/2026 en A/B à référence de style figée : l'anglais donne des points de
# trame plus nets et réguliers (voir « Calibrage »).
id: nb-trames
name: N&B à trames
description: Noir et blanc encré, ombres et volumes en trames, comme un manga imprimé.
order: 10
default: true
monochrome: true
lang: en
prompt_keywords: [black and white manga, halftone screentone dots, regular grey dot pattern, no cross-hatching]
# Tonalité « papier blanc » (11/10/2026) : les cases sortaient grises et bouchées (50 à 83 % de pixels
# sombres contre 21,7 % sur une planche de référence). Ajoutée au prompt positif de chaque case ; le
# négatif n'est lu qu'à vrai CFG (palier Qualité). Le QC vérifie la tonalité (`detectors.tone` de qc.yaml).
tonality: "White paper dominant, clean line art, screentone only in the shadows, large white areas, no muddy grey fill"
tonality_negative: "dark muddy image, grey overall, heavy black fill, underexposed"
