# Presets appliqués aux nouveaux projets (modifiables projet par projet).
page_format: a4-300dpi
# Palier des nouvelles séries : Rapide (int8, 25 pas — le réglage du workflow officiel « Image Edit
# (Qwen Image 2.1) »). Mesuré le 10/10/2026 : avec des références, 8 pas (Turbo) contre 25 pas changent
# ~60 % de l'image ; ~1 min par case au lieu de ~35 s, accepté pour la qualité. Les séries existantes
# gardent le leur (Turbo reste proposé dans la fiche série ; croquis, fiches de référence et planche de
# style restent au palier croquis / Turbo).
workflow: qwen-image-base-rapide
# Images de référence d'une case, par fiche (personnage, décor, objet) : principale = la seule image
# principale de la fiche (la 1re de sa galerie — une vue simple, pas une planche multi-poses que le
# modèle recopierait) ; toutes = la principale d'abord, puis les suivantes s'il reste des emplacements.
panel_references: principale
# Workflow choisi automatiquement pour une case dont un personnage a des images de référence
# (sinon : le workflow de la série). Une case peut imposer le sien (`generation_preset`).
# Rapide (25 pas) comme le palier par défaut ; le `with_references` du palier de la série prime.
workflow_with_references: qwen-image-edit-ref-rapide
# Palier des fiches de référence et du passage au propre de la planche de style, quel que soit le palier
# de la série : Turbo (ce sont des images de travail, refaites souvent ; les cases passent en Rapide).
# Son `with_references` sert dès qu'une image est envoyée. Absent = palier de la série.
workflow_library: qwen-image-turbo
# Palier « Régénérer en Qualité » de l'atelier (son `with_references` sert aux cases avec références).
workflow_quality: qwen-image-base
# Style de mise en page des nouvelles séries (presets/layout_styles/) : sage, dynamique, nerveuse.
layout_style: dynamique
# Palier « croquis » : brouillon de chaque case en quelques secondes, tri rapide, puis « Passer au
# propre » des seules compositions validées (preset `from_sketch` du palier de la série).
# Activé pour les nouvelles séries ; désactivable dans la fiche série.
sketch_enabled: true
# Workflow des croquis (son `with_references` sert aux cases avec références).
workflow_sketch: qwen-image-croquis
# Finition d'impression : agrandisseur de la version retenue avant l'assemblage (presets/upscalers/).
# Chaque série peut choisir le sien (fiche série).
upscaler: realesrgan-x4plus-anime-6b
# Pas d'agrandissement si la case atteint déjà cette part du dpi cible du format (0,9 × 300 = 270 dpi).
finishing_tolerance: 0.9
# Réparation ciblée (atelier) pour un workflow qui ne déclare pas `inpaint_with` (preset avec bloc `inpaint`).
workflow_inpaint: qwen-image-inpaint-turbo
# Planche de style (fiche série) : essais au palier croquis (`workflow_sketch`) de la scène test du genre
# (`scene_test` de presets/style_genres/), avec le `$style` de la série et une graine par essai.
# L'essai retenu passe au propre (`from_sketch` de `workflow_library`, sinon du palier de la série) et
# devient la référence de style.
style_board:
  trials: 4
  # Taille du propre ; le croquis garde ce ratio (grand côté : `long_side` du palier croquis).
  width: 1024
  height: 1024
  # Morceaux assemblés dans l'ordre ; un morceau dont une variable est vide est omis.
  # Variables : $scene (scène test du genre), $style (style de la série).
  prompt:
    - "Planche de style, scène test : $scene."
    - "Style : $style."
    - "Une seule illustration pleine page, aucun texte, aucune bulle."
  negative_prompt: "texte, lettres, bulles, cases multiples"
  # Référence de style validée — fiches de référence (personnages, objets, décors) :
  # with_subject = jointe seulement après une image du sujet (image de départ choisie ou variante
  # d'« Affiner »), en dernière image et s'il reste un emplacement ; sans image de départ, la fiche
  # se crée à partir de la description seule (texte → image) ;
  # always = jointe à chaque fiche (seule image envoyée sans image de départ) ; never = jamais.
  reference_sheets: with_subject
  # Cases : with_subject = jointe s'il reste un emplacement libre parmi les images de référence du
  # workflow (priorité : personnages > décor > objets > style), et seulement si la case a déjà une image
  # d'un personnage, de son décor ou d'un objet : jamais seule (le modèle d'édition la redessinerait
  # telle quelle) — une case sans autre référence passe par le workflow texte ;
  # free_slot = jointe s'il reste un emplacement, même seule ; never = jamais.
  # never (10/10/2026) : jointe à une case, la planche fait apparaître ses propres sujets (l'enfant et
  # son chat, le cerf-volant) malgré « référence de style seulement » (A/B à graine figée). Le style
  # des cases (génération, passage au propre, réparation) passe par les mots-clés `$style`.
  panels: never
