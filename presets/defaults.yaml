# Presets appliqués aux nouveaux projets (modifiables projet par projet).
page_format: a4-300dpi
workflow: qwen-image-base
# Workflow choisi automatiquement pour une case dont un personnage a des images de référence
# (sinon : le workflow de la série). Une case peut imposer le sien (`generation_preset`).
workflow_with_references: qwen-image-edit-ref
# Style de mise en page des nouvelles séries (presets/layout_styles/) : sage, dynamique, nerveuse.
layout_style: dynamique
