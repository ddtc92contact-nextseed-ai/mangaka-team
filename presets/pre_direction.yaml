# ADN de la série (pré-direction) : la charte chiffrée qui règle le scénariste, le directeur artistique et
# leurs contrôles, série par série. Voir presets/README.md (« ADN de la série ») et
# engine/mangaka_engine/pipeline/pre_direction.py.
#
# Uniquement des nombres bornés et des booléens (validés par Pydantic, jamais de texte libre). Le genre de la
# série donne les valeurs (`genres`, reprises sur `defaults`) ; la série peut en ajuster dans sa carte « ADN de
# la série » (les autres restent héritées du genre). `defaults` est le défaut ultime : genre sans valeurs
# propres, ou série d'avant les packs de style.
#
# La charte avertit, elle ne bloque pas : une règle enfreinte relance l'agent (relance complète pour l'échelle
# des plans et le dialogue, relance ciblée pour le reste), puis devient un avertissement visible (écrans
# Scénario et Direction artistique). Les parts (0 à 1) portent sur les cases ou les planches du chapitre.
#
# Familles :
#   panels    cases par planche (une pleine page d'une seule case reste permise)
#   shapes    part de planches à grande case (`big_panel_share`), au plus N planches de même forme d'affilée
#             (`max_same_in_a_row`) et part d'une même forme sur le chapitre (`max_same_share`) ; forme = page
#             choc, sinon gabarit choisi, sinon nombre de cases et de grandes cases
#   shots     part de chaque famille de plans (`shot_classes` ci-dessous), plafond des plans serrés (`tight_max`) ;
#             sous `wide.min` ou au-dessus de `tight_max`, la relance dit « élargis », au-dessus de `wide.max`
#             ou `medium.max`, « resserre »
#   presence  part de cases en vue subjective et de cases sans personnage à l'image
#   dialogue  répliques par planche (onomatopées à part, minimum borné par la place des cases, table `room` de
#             prompts/script.yaml) et cases sans réplique par planche (dès `silent_min_panels` cases) ; mots par
#             réplique au plus (`max_words`) et en moyenne (`max_mean_words`), répliques visées par case
#             (`target_per_panel`), parole exigée dans une case d'action (`action_needs_voice` ; false : une case
#             d'action muette est permise). Ces quatre-là remplacent ceux de `dialogue_rules` (prompts/script.yaml).
#   rhythm    courbe des rythmes de page de la direction artistique : position du premier pic, respiration après
#             un pic, pics d'affilée, pic final dans les N dernières planches (0 = libre)
#   places    décors et rythme : case d'établissement au changement de lieu (`establishing` : la première case d'un
#             nouveau lieu de la série est un plan large / d'ensemble, `shot_classes.wide`) et part de cases de
#             décor muettes, sans personnage à l'image ni réplique (`silent_decor_min`) ; le lieu d'une case est
#             son unité de lieu (lieux de la série, pipeline/locations.py), jamais son texte libre

# Plans de la direction artistique comptés dans chaque famille (les autres — plongée, contre-plongée — comptent
# dans le total sans entrer dans une famille). Plans serrés = gros plan + rapproché + insert.
shot_classes:
  close_up: [gros plan, très gros plan]
  medium_close: [plan rapproché]
  medium: [plan moyen, plan américain]
  wide: [plan large, plan d'ensemble]
  insert: [insert]
peak_rythmes: [climax]                 # rythme de page qui fait un pic
breath_rythmes: [respiration, calme]   # rythmes de page qui font une respiration
min_pages: 4             # courbe de rythme et formes de planche vérifiées dès 4 pages dirigées ensemble
big_importance: 3        # une case d'importance 3 (scénario) est une grande case…
big_area_ratio: 1.5      # …comme une case de gabarit 1,5 fois plus grande qu'une part égale

defaults:
  panels: { min_per_page: 3, max_per_page: 7 }
  shapes:
    big_panel_share: { min: 0.25, max: 0.75 }
    max_same_in_a_row: 2
    max_same_share: 0.4
  shots:
    close_up: { min: 0.1, max: 0.4 }
    medium_close: { min: 0.05, max: 0.4 }
    medium: { min: 0.05, max: 0.35 }
    wide: { min: 0.15, max: 0.35 }
    insert: { min: 0, max: 0.2 }
    tight_max: 0.6
  presence:
    subjective: { min: 0, max: 0.25 }
    empty: { min: 0, max: 0.3 }
  # Longueur des répliques : 22 mots au plus, 14 en moyenne (décision du 15/10 : 12 mots coupaient les phrases ;
  # essai « Nuit du pari », 14,2 mots par réplique mesurés). Une réplique peut porter une phrase entière ; une
  # longue tirade se coupe en plusieurs bulles ou plusieurs cases. Un genre ou une série peut les changer (une
  # série qui a réglé ses valeurs les garde).
  dialogue:
    min_per_page: 4
    max_per_page: 8
    min_silent_panels: 1
    max_words: 22
    max_mean_words: 14
    target_per_panel: 2
    action_needs_voice: true
  rhythm:
    first_peak: { min: 0.25, max: 0.4 }
    breath_after_peak: true
    max_peaks_in_a_row: 2
    final_peak_last_pages: 2
  places: { establishing: true, silent_decor_min: 0.03 }

# Défauts des 7 genres : la prose de leur `llm_guidelines` (style_genres/), chiffrée. Seules les valeurs qui
# changent sont écrites ; le reste vient de `defaults`. Longueur des répliques et parole du dialogue
# (`max_words`, `max_mean_words`, `target_per_panel`, `action_needs_voice`) : héritées de `defaults`, sauf un
# genre qui a une raison d'être plus bref (jeunesse) ; un genre les règle dans son bloc `dialogue`.
genres:
  # Rythme soutenu, 4 à 6 cases, grandes cases pour l'action, cliffhanger final ; dialogues courts et directs.
  shonen:
    panels: { min_per_page: 4, max_per_page: 6 }
    dialogue: { min_per_page: 4, max_per_page: 7, min_silent_panels: 1 }
    shapes:
      big_panel_share: { min: 0.4, max: 0.85 }
    shots:
      close_up: { min: 0.15, max: 0.4 }
      wide: { min: 0.15, max: 0.35 }
      tight_max: 0.6
    presence:
      subjective: { min: 0, max: 0.2 }
      empty: { min: 0, max: 0.25 }
    rhythm:
      first_peak: { min: 0.25, max: 0.4 }
      max_peaks_in_a_row: 2
      final_peak_last_pages: 1
    places: { silent_decor_min: 0.03 }
  # Émotions, 4 à 6 cases (3 quand une grande case porte le regard), gros plans sur les visages, monologues
  # intérieurs : plus de texte par planche.
  shojo:
    panels: { min_per_page: 3, max_per_page: 6 }
    dialogue: { min_per_page: 5, max_per_page: 9, min_silent_panels: 1 }
    shapes:
      big_panel_share: { min: 0.2, max: 0.6 }
    shots:
      close_up: { min: 0.25, max: 0.5 }
      medium_close: { min: 0.1, max: 0.45 }
      wide: { min: 0.1, max: 0.3 }
      tight_max: 0.75
    presence:
      subjective: { min: 0, max: 0.3 }
      empty: { min: 0, max: 0.2 }
    rhythm:
      first_peak: { min: 0.3, max: 0.5 }
      max_peaks_in_a_row: 1
      final_peak_last_pages: 2
    places: { silent_decor_min: 0.03 }
  # Public adulte, 5 à 7 cases, rythme posé, silences et cases muettes bienvenus.
  seinen:
    panels: { min_per_page: 5, max_per_page: 7 }
    shapes:
      big_panel_share: { min: 0.2, max: 0.6 }
    shots:
      close_up: { min: 0.1, max: 0.35 }
      wide: { min: 0.2, max: 0.4 }
      tight_max: 0.55
    presence:
      empty: { min: 0.05, max: 0.3 }
    dialogue: { min_per_page: 3, max_per_page: 7, min_silent_panels: 2 }
    rhythm:
      first_peak: { min: 0.3, max: 0.5 }
    places: { silent_decor_min: 0.06 }
  # Lent et contemplatif, 5 à 7 cases, cases de décor et de détails, pas de cliffhanger forcé.
  tranche-de-vie:
    panels: { min_per_page: 5, max_per_page: 7 }
    shapes:
      big_panel_share: { min: 0.1, max: 0.5 }
    shots:
      close_up: { min: 0.1, max: 0.3 }
      wide: { min: 0.2, max: 0.4 }
      insert: { min: 0, max: 0.25 }
      tight_max: 0.5
    presence:
      empty: { min: 0.1, max: 0.35 }
    dialogue: { min_per_page: 3, max_per_page: 7, min_silent_panels: 2 }
    rhythm:
      first_peak: { min: 0.3, max: 0.6 }
      max_peaks_in_a_row: 1
      final_peak_last_pages: 0
    places: { silent_decor_min: 0.1 }
  # Planches denses de 6 à 9 cases en gaufrier régulier, dialogues plus fournis qu'en manga.
  franco-belge:
    panels: { min_per_page: 6, max_per_page: 9 }
    shapes:
      big_panel_share: { min: 0, max: 0.4 }
      max_same_in_a_row: 4     # le gaufrier régulier se répète volontiers
      max_same_share: 0.7
    shots:
      close_up: { min: 0.05, max: 0.3 }
      wide: { min: 0.2, max: 0.4 }
      tight_max: 0.5
    dialogue: { min_per_page: 6, max_per_page: 12, min_silent_panels: 1 }
    rhythm:
      first_peak: { min: 0.25, max: 0.5 }
    places: { silent_decor_min: 0.04 }
  # Enfants de 6 à 10 ans : simple et lisible, 3 à 5 cases, une action par case, phrases courtes. Répliques
  # plus brèves que le défaut (14 mots au plus, 8 en moyenne) : un lecteur débutant lit une bulle d'une traite.
  jeunesse:
    panels: { min_per_page: 3, max_per_page: 5 }
    shapes:
      big_panel_share: { min: 0.3, max: 0.8 }
    shots:
      close_up: { min: 0.1, max: 0.35 }
      wide: { min: 0.2, max: 0.4 }
      tight_max: 0.55
    presence:
      subjective: { min: 0, max: 0.15 }
      empty: { min: 0, max: 0.2 }
    dialogue: { min_per_page: 3, max_per_page: 6, min_silent_panels: 1, max_words: 14, max_mean_words: 8 }
    rhythm:
      first_peak: { min: 0.25, max: 0.45 }
      max_peaks_in_a_row: 1
    places: { silent_decor_min: 0.03 }
  # Quotidien et combats magiques, 4 à 6 cases, une grande case par transformation ou attaque spéciale.
  magical-girl:
    panels: { min_per_page: 4, max_per_page: 6 }
    shapes:
      big_panel_share: { min: 0.4, max: 0.85 }
    shots:
      close_up: { min: 0.15, max: 0.4 }
      wide: { min: 0.15, max: 0.35 }
      tight_max: 0.6
    rhythm:
      first_peak: { min: 0.25, max: 0.4 }
      max_peaks_in_a_row: 2
    places: { silent_decor_min: 0.03 }
