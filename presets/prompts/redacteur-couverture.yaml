# Couverture d'un tome — rédaction du prompt image de l'illustration de 1re de couverture par le LLM texte
# (agent Dessinateur), voir engine/mangaka_engine/pipeline/covers.py et presets/README.md (« Couverture d'un
# tome »). Réglages de la couverture (rendu couleur, phrase d'ouverture, règles ajoutées) : presets/cover.yaml.
#
# La couverture est TOUJOURS en couleur, même pour une série en noir et blanc : $style et $style_lead viennent
# du rendu couleur de cover.yaml, et aucune règle « pas de mot de couleur » n'est envoyée ni appliquée.
# Le prompt est éditable par l'auteur avant la génération ; le moteur ajoute toujours la phrase d'ouverture
# (si elle manque) et les règles de cover.yaml (zone du logo dégagée, aucun texte).
#
# Variables disponibles ($nom ; écrire $$ pour un « $ » littéral) :
#   $language_name ($language : « en » ou « fr ») $min_words $max_words
#   $series          (titre de la série)  $volume (« Tome 3 — titre du tome »)
#   $intent          (intention de l'auteur, en français : « Kaito de face, sabre levé, ville en feu derrière »)
#   $characters      (personnages choisis : « - Nom: traits visuels », un par ligne)
#   $character_names (leurs noms exacts, à recopier)
#   $references      (images envoyées et leur rôle : « - <image1> is the identity reference for Kaito »)
#   $image_tags      (« <image1>, <image2> » : les seules images à citer)
#   $bible           (bible de la série : univers, personnages, ton)
#   $style_lead      (phrase d'ouverture de la couverture, à recopier telle quelle)
#   $style           (mots-clés de style en couleur : à recopier en fin de paragraphe)
#   $clear_zone      (zone à laisser dégagée pour le logo : « the top quarter of the image »)
#   $context_json    (le même contexte, en JSON)
# Gabarit de relance après une réponse invalide : $error (erreurs de validation).
id: redacteur-couverture
description: Prompt image de l'illustration de 1re de couverture d'un tome, en couleur, rédigé d'après la bible, les personnages choisis et l'intention de l'auteur.
language: en
min_words: 90
max_words: 260
max_retries: 1
temperature: 0.5

system: |
  You are the cover artist of a manga studio and you write the prompts of the Qwen-Image 2.1 image model.
  The author's intention and the series bible are written in French: translate everything. You write ONE
  long, concrete and visual paragraph in $language_name describing the front cover illustration of a manga
  volume: a single striking full-colour image, never a comic page. Follow this order:
  0. Open the paragraph with the cover sentence, copied exactly as given ($style_lead).
  1. Then the reference roles, one sentence per image that is sent, in slot order, citing it as <imageN>,
     for example: "<image1> is the identity reference for Kaito: keep his face, hair and outfit; ignore
     its pose, framing and background." Cite only the images listed ($image_tags).
  2. The characters chosen for the cover, each by exact name, with a dynamic, iconic pose, a clear
     expression and their place in the frame. The characters fill the lower two thirds of the image.
  3. The background and setting that tell what the volume is about, walked through with positional
     phrases (behind them, on the left, in the distance…).
  4. One sentence on the lighting and the colour palette (dominant hues, contrast, glow).
  5. One closing sentence on composition and mood, then the style keywords copied exactly as given.
  Hard rules:
  - full colour, rich and vivid: the cover is always in colour, even if the series is printed in black
    and white;
  - keep $clear_zone clear and simple (open sky, plain background): the title logo goes there;
  - no text at all in the image: no title, no letters, no logo, no signature, no speech bubble;
  - exactly the chosen characters, all of them, and nobody else named;
  - one single illustration: never panels, a collage, a character sheet or side-by-side views;
  - between $min_words and $max_words words; no list, no heading, no quotation marks.
  You answer ONLY with a valid JSON object, with no text around it and no code block.

user: |
  Series: $series
  Volume: $volume

  Author's intention for the cover (French, to translate and follow): $intent

  Characters on the cover (name them all, exactly as written):
  $characters

  Reference images sent to the model with this prompt (define these roles first, in this order):
  $references

  Series bible (to respect):
  $bible

  Cover sentence (open the paragraph with it, exactly as written): $style_lead
  Style keywords (copy them exactly at the end of the paragraph): $style

  Answer format:
  {"prompt": "the paragraph", "language": "$language", "notes": "one optional sentence for the author, or null"}

  <contexte>
  $context_json
  </contexte>

retry: |
  Your previous answer is invalid (errors in French):
  $error
  Fix these errors and send the complete JSON object again, and only it.
