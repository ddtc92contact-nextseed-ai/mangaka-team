# Étape 1 — découpage d'un chapitre en pages → cases (prompt du LLM texte).
#
# Variables disponibles ($nom ; écrire $$ pour un « $ » littéral) :
#   $series_title $reading_direction $characters $previous_chapters
#   $character_names  (noms exacts des fiches personnages, à recopier tels quels : « Kaï », « Lina »)
#   $style_packs      (packs de style de la série : genre, rendu, ton, réglages fins — noms et descriptions)
#   $style_guidelines (consignes du genre et du ton : rythme, cases par page, vocabulaire adapté à l'âge)
#   ($series_style : ancien nom de $style_packs, gardé pour les prompts personnalisés)
#   $decors $objets (bibliothèque de la série : « - id N · nom : description courte », un par ligne ; les
#                    véhicules et créatures sont dans $objets, leur sorte après le nom : « Le Faucon (véhicule) »)
#   $lieux          (lieux de la série, unité de lieu des cases : « - id N · nom : description (décor : …) »)
#   $chapter_number $chapter_title $synopsis $target_pages $bubble_kinds
#   ($shot_types : liste des plans, plus utilisée — la direction artistique cadre les cases ; gardée pour
#    les prompts personnalisés)
#   $intensities $rythmes  (indices de mise en page, cf. presets/README.md « Direction artistique »)
#   $dialogue_rules (règles de dialogue ci-dessous, en clair : densité, longueur, place, variété)
#   $pre_direction  (charte chiffrée de la série, son ADN : cases par planche, dialogue par planche, courbe de
#                    rythme — presets/pre_direction.yaml, réglable sur la fiche série)
#   $scenes        (scènes validées par l'auteur à l'étape Scènes : scène, type, pages, profil de tempo en clair ;
#                   « (pas de liste de scènes validée…) » pour un chapitre écrit sans scènes)
#   $context_json  (le même contexte, en JSON)
#   $bible         (bible de la série : univers, ton, personnages, règles, gags, résumés validés)
#   $savoir_faire  (passages du savoir-faire de l'agent « script », avec leur source ; voir knowledge.yaml)
# Gabarit de relance après une réponse invalide : $error (erreurs de validation).
id: script
description: Découpage d'un chapitre en pages et cases, avec dialogues et résumé.
max_retries: 2            # nouveaux essais après une réponse invalide (2 au maximum)
temperature: 0.7
max_previous_chapters: 8  # résumés des chapitres précédents envoyés pour la continuité

# Dialogues, vérifiés sur chaque réponse (pipeline/dialogues.py `check_dialogues`) : une règle enfreinte
# relance le scénariste avec l'erreur ; après les relances, le découpage est gardé avec un avertissement
# visible dans l'écran Scénario. Les onomatopées ne comptent pas comme répliques. Sans ce bloc, aucune règle.
# (Audit du chapitre 3 « vulcano », 13/10 : 0,75 parole par case contre 1,50 au chapitre 1, cinq cases de
# combat réduites à leur onomatopée, plus aucune pensée, voix off ni narration.)
dialogue_rules:
  target_per_panel: 2       # répliques visées dans chaque case où un personnage présent peut parler…
  # …et, compté par planche, 4 à 8 répliques (minimum borné par la place des cases) et au moins une case sans
  # réplique dès 2 cases. Valeurs par défaut : l'ADN de la série les remplace (famille « dialogue » de
  # pre_direction.yaml, réglée par genre et par série).
  min_per_page: 4
  max_per_page: 8
  min_silent_panels_per_page: 1
  silent_min_panels: 2
  # Longueur des répliques, répliques visées par case et parole d'une case d'action : valeurs par défaut aussi,
  # remplacées par l'ADN de la série (famille « dialogue » : max_words, max_mean_words, target_per_panel,
  # action_needs_voice).
  max_words: 22             # mots au plus par réplique (une phrase entière, pas une tirade : elle se coupe en
  max_mean_words: 14        # plusieurs bulles ou plusieurs cases) ; au plus 14 mots en moyenne
  action_needs_voice: true  # case d'action (choc ou onomatopée) : au moins un mot d'un personnage (false : muette permise)
  action_intensities: [choc]
  require_inner_voice: true # au moins une pensée, voix off ou narration par chapitre (false : l'auteur s'en passe)
  inner_voice_kinds: [thought, "off", narration]   # « off » entre guillemets (sinon YAML lit un booléen)
  # Place des bulles, selon le nombre de cases de la page : répliques au plus par case (`replies`) et mots au
  # plus pour toutes les répliques de la case (`words`, la longueur réelle). Mesuré le 15/10 (A4 à 300 DPI,
  # zone de bulles de layout.yaml, police à sa taille normale) : planche de 4 cases → trois répliques de 23,
  # 15 et 8 mots ; de 6 cases → deux répliques de 23 mots ; de 9 cases → une réplique de 23 mots. Une case
  # forte (importance 3) reçoit `big_panel_bonus` réplique et `big_panel_bonus_words` mots de plus.
  room:
    - { max_panels: 4, replies: 3, words: 46 }
    - { max_panels: 6, replies: 2, words: 36 }
    - { max_panels: 9, replies: 1, words: 22 }
  big_panel_bonus: 1
  big_panel_bonus_words: 14
  check_room: true          # après la mise en page : chaque bulle tient dans la zone de bulles de sa case…
  max_cover: 0.5            # …et les bulles couvrent au plus la moitié de la case (règle de la name)

# Brief d'image de chaque case (pipeline/brief.py) : chaque champ a UN rôle, et rien de contradictoire n'atteint
# l'image (« setting » et « staging » partent tels quels dans le prompt image). Vérifié sur chaque réponse : un
# défaut relance le scénariste avec l'erreur ; après les relances, le découpage est gardé et le défaut est signalé
# sur la case dans l'écran Scénario. Termes comparés sans accents ni casse, en mots entiers ; un terme de décor
# couvre aussi son pluriel. Sans ce bloc, aucun contrôle.
# (Audit du chapitre 15 « Second round » d'OSU, 18/10 : 62 cases sur 82 mettaient un plan ou des personnages dans
# « setting », 28 citaient dans setting ou staging un personnage absent de la case, dont 23 hors cadre.)
brief_rules:
  check_cast: true          # un nom de fiche (ou un alias) dans setting / staging, absent de « characters »
  check_setting: true       # vocabulaire de plan dans setting ; setting vide ou sans aucun mot de décor
  check_slots: true         # page qui a plus de cases que d'emplacements dans son gabarit de mise en page
  check_location: true      # description qui nomme un autre lieu de la série que celui de la case
  # Vocabulaire de plan et de cadrage, interdit dans « setting » (le plan vient de la direction artistique).
  # « arrière-plan » et « au loin » n'y sont pas : la profondeur du décor (montagnes au loin) est permise.
  shot_terms: [
    plan d'ensemble, plan large, plan moyen, plan américain, plan rapproché, plan serré, plan taille,
    plan poitrine, plan pied, plan en pied, gros plan, très gros plan, insert, plongée, contre-plongée,
    vue subjective, vue plongeante, caméra, cadrage, recadrage, hors cadre, hors champ,
    champ contrechamp, champ contre-champ, zoom, travelling, panoramique, en amorce, focale, objectif,
    cadre penché, angle de vue, de dos, de face, de profil, de trois quarts
  ]
  # Mots de décor : moment (heure, météo, saison, lumière) et éléments visibles d'un lieu. Les mots du lieu de la
  # case comptent aussi (« Plage de sable blanc » : plage, sable, blanc).
  decor_terms: [
    # moment, lumière, météo, saison
    aube, aurore, matin, matinée, midi, après-midi, soir, soirée, crépuscule, nuit, minuit, jour, journée,
    heure, coucher de soleil, lever de soleil, soleil, lune, étoile, ciel, nuage, brume, brouillard, pluie,
    orage, neige, vent, tempête, éclair, arc-en-ciel, chaleur, lumière, ombre, pénombre, obscurité, lueur,
    contre-jour, printemps, été, automne, hiver, beau temps, temps gris, grisaille, humidité, givre, gel, rosée,
    # nature
    plage, sable, mer, océan, vague, écume, rivage, rive, côte, crique, baie, port, quai, ponton, jetée, île,
    lac, étang, mare, rivière, fleuve, ruisseau, cascade, source, marais, eau, glace, falaise, rocher, roche,
    pierre, caillou, galet, grotte, caverne, montagne, colline, vallée, plaine, prairie, champ, pré, désert,
    dune, volcan, cratère, lave, forêt, bois, jungle, clairière, arbre, palmier, cocotier, tronc, branche,
    feuillage, feuille, buisson, broussaille, fourré, herbe, fleur, mousse, liane, racine, sentier, chemin,
    piste, horizon, terre, boue, poussière, sol, terrain, gazon, pelouse, jardin, verger, potager, ferme,
    # ville, bâtiments
    ville, village, quartier, rue, ruelle, avenue, boulevard, place, carrefour, trottoir, pavé, route,
    autoroute, pont, tunnel, gare, station, métro, quai, parking, immeuble, maison, cabane, hutte, tente,
    temple, sanctuaire, église, château, palais, tour, donjon, rempart, muraille, mur, toit, terrasse, balcon,
    façade, fenêtre, vitre, porte, portail, escalier, marche, couloir, hall, salle, chambre, cuisine, salon,
    bureau, classe, école, lycée, collège, gymnase, dojo, tatami, arène, stade, ring, terrain, vestiaire,
    magasin, boutique, marché, échoppe, étal, café, bar, restaurant, auberge, taverne, hôpital, laboratoire,
    labo, usine, entrepôt, hangar, atelier, garage, cave, grenier, sous-sol, cour, préau, plafond, plancher,
    parquet, carrelage, moquette, tapis, rideau, lampe, lanterne, néon, enseigne, panneau, lampadaire,
    # mobilier et objets de décor
    table, chaise, banc, lit, canapé, fauteuil, étagère, bibliothèque, comptoir, bureau, tableau, écran,
    tonneau, baril, caisse, carton, sac, coffre, statue, fontaine, colonne, pilier, arche, clôture, barrière,
    grille, haie, palissade, poteau, câble, fil, torche, feu, flamme, bougie, cheminée, foyer,
    # véhicules et mer
    bateau, navire, voilier, barque, pont du bateau, bastingage, mât, voile, cale, cabine, coque, avion,
    voiture, train, wagon, bus, camion, vaisseau, cockpit,
    # ambiance d'un lieu
    foule, décor, paysage, panorama, lointain, au loin, fond, silhouette, reflet, débris, ruines, fumée,
    poussière, trace, traces de pas, lucioles, linge
  ]

system: |
  Tu es scénariste de manga professionnel. Tu découpes un chapitre en pages puis en cases,
  comme pour une publication hebdomadaire : l'histoire, l'intention de chaque case et ce que
  fait chaque personnage. Tu respectes la continuité de la série (personnages, événements des
  chapitres précédents) et le rythme d'un vrai chapitre : accroche, montée, cliffhanger final.
  Le cadrage de chaque image (le plan, l'angle de la caméra) revient au directeur artistique, à
  l'étape suivante : tu ne le décides pas.
  Tu réponds UNIQUEMENT par un objet JSON valide, sans texte autour ni bloc de code.

user: |
  Série : « $series_title »
  Style de la série :
  $style_packs
  Sens de lecture : $reading_direction

  Personnages connus :
  $characters

  Décors récurrents de la série (bibliothèque) :
  $decors

  Objets, véhicules et créatures récurrents de la série (bibliothèque ; la sorte suit le nom) :
  $objets

  Lieux de la série (déjà installés dans les chapitres précédents) :
  $lieux

  Résumé des chapitres précédents :
  $previous_chapters

  Bible de la série (à respecter strictement) :
  $bible

  Savoir-faire de l'équipe (fiches de méthode : applique-les sans les citer) :
  $savoir_faire

  Chapitre $chapter_number — « $chapter_title »
  Synopsis ou script brut :
  $synopsis

  Consignes du genre et du ton de la série (priment sur les valeurs indicatives ci-dessous) :
  $style_guidelines

  Scènes du chapitre, validées par l'éditeur (vérifiées : chaque page porte le numéro de sa scène dans
  « scene », les pages suivent l'ordre des scènes, et chaque scène a EXACTEMENT son nombre de pages ;
  le tempo d'une scène précise la charte de la série pour ses pages) :
  $scenes

  Contraintes :
  - environ $target_pages pages ; le nombre de cases par page suit la charte de la série ci-dessous ;
  - « kind » d'un dialogue vaut exactement l'une de ces valeurs : $bubble_kinds
    (narration = récitatif, off = voix hors champ) ;
  - « importance » vaut 1 (case de transition), 2 (case normale) ou 3 (case forte, grande) ;
  - « intensity » (facultatif) vaut l'une de ces valeurs : $intensities — « choc » pour un temps
    d'action ou de surprise, « calme » pour un moment posé ; la mise en page y place biais et grandes cases ;
  - « rythme » d'une page (facultatif) vaut l'une de ces valeurs : $rythmes — « rapide » pour une
    page d'action, « lent » pour une page d'ambiance ;
  - « sfx » d'une case (facultatif) : onomatopées en lettrage hors bulle (« VROUM ! », « CLIC », « BIIIP ! »),
    chacune avec « text » (court, en majuscules) et « intensity » ($intensities) ; jamais dans « description » :
    le dessinateur ne dessine aucun texte, le lettreur les pose ;
  - « characters » liste les personnages PRÉSENTS À L'IMAGE — ceux que le dessinateur dessine dans
    cette case, tous, sans en oublier ; « offscreen » liste ceux que la case CITE mais qui restent HORS
    DU CADRE (ils ne sont pas dessinés). Un personnage cité n'est pas forcément dans l'image :
    · « Seku et Angus voient au loin les trafiquants jeter des barils dans le volcan » : on montre ce
      qu'ils voient → characters : les trafiquants ; offscreen : Seku, Angus ;
    · « Trafiquant 2 panique et recule » → characters : Trafiquant 2 seul ; les héros, s'ils sont dans
      la scène sans être dans cette case, vont dans offscreen ;
    · « Trafiquant 1 rampe et s'enfuit » → characters : Trafiquant 1 seul ;
    · « Le sol tremble, le volcan gronde » → characters : [] (une case de décor n'a AUCUN personnage) ;
    une case peut montrer un lieu, un objet ou une foule anonyme sans aucun personnage : n'y ajoute
    jamais les héros par habitude. Nomme dans « description » chaque personnage présent ;
  - pour un personnage qui a une fiche, recopie EXACTEMENT le nom de sa fiche, parmi : $character_names
    (jamais « le vieux maître » ni « Maître Kaï » : seulement « Kaï ») ; « offscreen » et « speaker »
    suivent la même règle ; un figurant sans fiche garde un nom simple ;
  - « lieu » : le lieu de la case, toujours rempli — l'id (nombre) d'un lieu de la série ci-dessus,
    ou, pour un lieu nouveau, son nom court (« La clairière », « La crique ») ; toutes les cases qui se
    passent au même endroit portent le MÊME lieu (même id, ou exactement le même nom) : un lieu est un
    endroit, pas une rédaction (« clairière » et « clairière au centre de l'île » sont le même lieu) ;
  - une case peut avoir un lieu différent de sa scène : le pont du bateau n'est pas la plage. Si la case
    montre un autre endroit que les cases voisines (le bateau vu depuis la plage, puis le pont du bateau), donne-lui
    SON lieu ; le lieu de la case doit être celui où se passe sa description ;
  Chaque champ d'une case a UN rôle (ils partent tels quels vers le dessinateur, qui dessine tout ce qui y est
  écrit) :
  - « description » : un INSTANT FIGÉ et dessinable, ce que montre l'image à ce moment précis. Jamais une action
    qui dure ou qui s'enchaîne, jamais un point de vue sans dire ce qu'on voit :
    · « Haru double Ren » → « Haru court un pas devant Ren, tourne la tête vers lui avec une grimace moqueuse » ;
    · « Kurogane observe la course au loin » → « Kurogane accoudé au bastingage, un sourire ironique, les coureurs
      minuscules sur la plage derrière lui » ;
    · « Les trois garçons se dispersent pour encercler le gorille » → « Haru, Ren et Tora en triangle autour du
      gorille, genoux fléchis, prêts à bondir » ;
  - « setting » (décor de la case) : le MOMENT (heure, météo, saison, lumière) et les ÉLÉMENTS VISIBLES du lieu
    (« bord du lac, fin d'après-midi, herbes hautes, rochers moussus, montagnes au loin »). Jamais de plan ni de
    cadrage (aucun mot de caméra, ni « hors cadre ») et jamais de nom de personnage : « Cadrage serré sur Tora,
    Haru et Ren derrière lui, le gorille hors cadre » est interdit ; écris « plage de sable blanc, midi, palmiers
    penchés, mer calme » ;
  - « staging » (mise en scène) : la pose, le geste, le regard, l'expression et la place dans l'image (gauche,
    droite, premier plan, arrière-plan) des SEULS personnages de « characters » ; jamais un personnage hors
    cadre ni un absent (s'il doit être vu, il est dans « characters »). Il AJOUTE à la description ce qu'elle ne
    dit pas, il ne la reformule pas ;
  - le plan et l'angle de la case : jamais. Ils viennent du directeur artistique, à l'étape suivante ;
  - « decor » : l'id (nombre) du décor récurrent où se passe la case, pris UNIQUEMENT dans la liste
    des décors ci-dessus, ou null si la case se passe ailleurs ;
  - « objets » : les ids (nombres) des objets, véhicules et créatures récurrents visibles dans la case,
    pris UNIQUEMENT dans la liste ci-dessus ([] s'il n'y en a pas) ; n'invente jamais d'id. Un véhicule
    (le vaisseau, la moto) ou une créature (l'animal de compagnie, le monstre) qui a une fiche va dans
    « objets », jamais dans « characters » : une créature ne parle pas et n'est pas un personnage ;
  - répliques en français, comme dans un vrai manga : une réplique peut porter une phrase entière, mais
    l'image raconte d'abord ; une longue tirade se coupe en plusieurs bulles ou sur plusieurs cases ;
    « dialogues » ne contient jamais d'onomatopée (elles vont dans « sfx ») ;
  - « summary » : résumé du chapitre en 3 à 6 phrases, pour assurer la continuité des chapitres suivants.

  Charte de la série (son ADN, chiffré et vérifié : une réponse qui s'en écarte te sera renvoyée) :
  $pre_direction

  Dialogues (vérifiés : une réponse qui enfreint ces règles est refusée) :
  $dialogue_rules

  Format de réponse :
  {"pages": [{"scene": 1, "rythme": "normal", "panels": [{"description": "…", "setting": "…", "staging": "…",
     "characters": ["…"], "offscreen": [], "lieu": "La clairière", "decor": null, "objets": [],
     "importance": 2, "intensity": "normal",
     "dialogues": [{"speaker": "…", "text": "…", "kind": "speech"}, {"speaker": "…", "text": "…", "kind": "shout"}],
     "sfx": [{"text": "VROUM !", "intensity": "choc"}]}]}],
   "summary": "…"}

  <contexte>
  $context_json
  </contexte>

retry: |
  Ta réponse précédente est invalide :
  $error
  Corrige ces erreurs et renvoie l'objet JSON complet, et uniquement lui. Garde ce qui était juste :
  pour les dialogues, ajoute, coupe ou retire des répliques sans réécrire le reste du découpage.
