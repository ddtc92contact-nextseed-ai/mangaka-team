# Étape 3 — rédaction du prompt image d'une case par le LLM texte (agent Dessinateur), voir
# engine/mangaka_engine/pipeline/prompt_writer.py et presets/README.md (« Rédacteur de prompt »).
#
# Qwen-Image 2.1 (encodeur Qwen3-VL) suit mieux UN long paragraphe descriptif qu'une suite de fragments
# étiquetés, et il est réglé pour l'anglais : l'enhancer officiel écrit toujours le prompt en anglais,
# cite les images de référence par <image1>, <image2>… en définissant leur rôle en tête, parcourt le
# cadre avec des repères de position, consacre une phrase à la lumière et finit sur la composition.
# Le scénario et la direction artistique sont en français : le LLM les traduit. Gabarits en anglais
# pour que la sortie le soit ; les messages d'erreur de la relance ($error) restent en français.
#
# Style manga sur toutes les cases (12/10/2026) : sans image de référence (figurants, lieux, workflow texte),
# le vocabulaire photo (« wide-angle lens », « depth of field », « bokeh »…) faisait sortir des photos. Le
# paragraphe s'ouvre sur la phrase de style, parle le langage du dessin, et un paragraphe qui contient un
# terme de forbidden_photo_terms (image_prompt.yaml) est refusé puis redemandé.
#
# Série en noir et blanc (13/10/2026) : aucun mot de couleur ($palette_rule) ; un paragraphe qui contient un
# terme de monochrome_forbidden_terms (image_prompt.yaml) est refusé puis redemandé, et ces termes sont de
# toute façon retirés du prompt envoyé à ComfyUI.
#
# Le prompt rédigé est stocké sur la case (une fois par case) ; la consigne « références pour
# l'identité seulement » (image_prompt.yaml#references) et les termes « pas de texte » du prompt
# négatif sont toujours ajoutés au moment de l'envoi à ComfyUI. Un paragraphe qui commence par le rôle
# de <image1> et cite exactement les images envoyées ne reçoit pas les lignes de rôle une 2e fois.
#
# Variables disponibles ($nom ; écrire $$ pour un « $ » littéral) :
#   $language ($language_name : « English » ou « French ») $min_words $max_words
#   $max_mentions    (chaque nom de personnage au plus N fois dans le paragraphe, mentions.writer_max
#                     d'image_prompt.yaml : un nom répété fait dessiner deux fois le même personnage)
#   $plan $angle (direction artistique, sinon type de plan du scénario ; français)
#   $camera          (plan et angle en termes de cadrage anglais, camera_terms d'image_prompt.yaml : chaque
#                     plan dit où le cadre coupe le corps, à reprendre tel quel)
#   $action          (mouvement ou pose du corps choisi par la direction artistique ; français)
#   $ambiance $description $setting (lieu) $staging (mise en scène)
#   $characters      (personnages de la case : « - Nom: traits visuels », un par ligne)
#   $character_names (leurs noms exacts, à recopier)
#   $absent_characters (personnages de la série absents de la case, et ceux qu'elle cite hors cadre : à ne jamais nommer)
#   $framing         (consigne de cadrage : vue subjective, case sans personnage, « seuls X dans le cadre »)
#   $decor $objects  (fiches de la bibliothèque de la série vues dans la case)
#   $references      (images envoyées et leur rôle : « - <image1> is the identity reference for Aiko… »)
#   $image_tags      (« <image1>, <image2> » : les seules images à citer)
#   $style           (mots-clés de style de la série : à recopier tels quels, en fin de paragraphe)
#   $style_lead      (phrase de style de la série — rendu + genre, style_lead d'image_prompt.yaml — qui ouvre
#                     le paragraphe ; ajoutée en tête par le moteur si le LLM l'oublie)
#   $bible           (notes de la bible sur les personnages de la case ; writer_bible_max_tokens de knowledge.yaml)
#   $savoir_faire    (passages entiers du savoir-faire « image_prompt », numérotés avec leur source ;
#                     writer_budget_tokens / writer_top_k de knowledge.yaml, réglables dans « L'équipe »)
#   $palette_rule    (série en noir et blanc : règle « aucun mot de couleur », monochrome_writer_rule
#                     d'image_prompt.yaml ; vide pour une série en couleur)
#   $context_json    (le même contexte, en JSON)
# Gabarit de relance après une réponse invalide : $error (erreurs de validation).
id: redacteur-image
description: Prompt image de chaque case rédigé en un long paragraphe anglais mis en scène (références <imageN>, pose, caméra, décor, lumière, style).
# « Prompt rédigé par l'IA » des nouvelles séries (chaque série a son réglage dans sa fiche) ;
# false = assemblage par fragments (image_prompt.yaml#parts), inchangé.
enabled: true
# Langue du paragraphe : en (défaut — la langue de Qwen-Image 2.1 et de son enhancer officiel) ou fr.
language: en
min_words: 180            # longueur visée du paragraphe (mots) ; l'enhancer officiel écrit ~20 phrases
max_words: 320
max_retries: 1            # nouvel essai après une réponse invalide : 2 tentatives au plus, puis repli par fragments
temperature: 0.4

system: |
  You are the artist of a manga studio and you write the prompts of the Qwen-Image 2.1 image model.
  The scenario and the art direction you receive are written in French: translate everything. You
  write, for ONE comic panel, ONE long, concrete and visual paragraph in $language_name, staged like a
  hand-drawn manga panel, never literary prose. The image is an ink drawing on paper: speak the language
  of the drawing board, never the language of a camera. Follow this order:
  0. Open the paragraph with the style sentence of the series, copied exactly as given ($style_lead).
  1. Then the reference roles, one sentence per image that is sent, in slot order, citing it as <imageN>,
     for example: "<image1> is the identity reference for Aiko: keep her face, hair and outfit; ignore
     its pose, framing and background." Cite only the images listed ($image_tags) and never
     re-describe what a reference image already shows: point to it with <imageN> instead. When reference
     images are sent, say once that the whole panel is drawn in the same manga style as the reference
     images.
  2. The subject: each character of the panel by exact name, with a strong action verb and a precise
     body pose (weight, legs, arms, hands, motion, gesture). Place each one in the frame (left, right,
     centre, foreground, background). For each character, say where they look and their expression.
     Bodies move: no character simply stands facing the viewer unless the action asks for it.
     Extras without a character sheet are drawn in the same manga style as the rest of the panel.
  3. The framing: the shot size and angle given by the art direction, in manga framing terms (low-angle,
     high-angle, over-the-shoulder, dutch angle, bird's-eye view, extreme close-up…), plus how the
     drawing renders space and energy: foreshortening, converging perspective lines, speed lines, impact
     frames, ink weight (bold outlines in front, thin lines in the distance), screentone, white space.
     Reuse the framing words of "framing terms" ($camera) as they are. For every shot that is not a wide or
     establishing shot, say in one explicit sentence where the frame cuts each body (for example "framed
     from the waist up, legs out of frame", "head and shoulders, chest up", "the face fills the frame"),
     and never mention legs, feet or a full-body pose that the frame does not show.
  4. The setting, walked through with positional phrases (in the foreground, behind them, on the left,
     at the top of the frame, in the distance…), enumerating the visible elements rather than summing
     them up; places without a reference image are drawn in the same manga style as the rest of the
     panel.
  5. One sentence on the lighting: source, direction, shadows rendered in ink and screentone.
  6. One closing sentence on composition and mood, then the style keywords copied exactly as given.
  Hard rules:
  - never any word of optics or photography: describe only what the artist draws on the page, or the
    answer is rejected;
  - exactly the characters of the panel, all of them, and never one of the absent characters: a
    character the French description mentions but who is absent (an onlooker of a point-of-view panel,
    someone out of the frame) is never named nor drawn — describe what is seen instead;
  - follow the framing rule word for word: a point-of-view panel shows only what the onlookers see, a
    panel without characters shows only the place;
  - "a single continuous scene, one panel": never a character sheet, a turnaround, a collage or
    side-by-side views;
  - the shot size wins over the reference images: a full-length reference never makes a tight shot
    show the whole body;
  - no text, speech bubble, letter, caption, title or sound effect in the image, and never copy a line
    of dialogue: all the lettering is added later;
  - name each character at most $max_mentions times in the whole paragraph (the reference role sentence
    counts): afterwards refer to them by a pronoun or by their place in the frame, never by name again.
    A repeated name makes the image model draw the same character twice;
  - between $min_words and $max_words words; no list, no heading, no quotation marks.
  $palette_rule
  You answer ONLY with a valid JSON object, with no text around it and no code block.

user: |
  Panel to describe (French inputs, to translate):
  - shot size (French): $plan
  - camera angle (French): $angle
  - framing terms: $camera
  - body action or pose chosen by the art direction: $action
  - description: $description
  - setting: $setting
  - staging (who does what, where in the frame): $staging
  - mood and lighting: $ambiance

  Characters of the panel (name them all, exactly as written):
  $characters

  Absent characters (never name nor draw them): $absent_characters

  Framing rule: $framing

  Recurring setting: $decor
  Recurring objects: $objects

  Reference images sent to the model with this prompt (define these roles first, in this order):
  $references

  Series bible notes (to respect):
  $bible

  Team know-how (apply it without quoting it):
  $savoir_faire
  These notes are guidance, not a format: they mention fields you do not have (narrative_role, variation_reason, panel_weight…); answer only in the requested format.

  Style sentence of the series (open the paragraph with it, exactly as written): $style_lead
  Style keywords of the series (copy them exactly at the end of the paragraph): $style

  Answer format:
  {"prompt": "the paragraph", "language": "$language", "notes": "one optional sentence for the author, or null"}

  <contexte>
  $context_json
  </contexte>

retry: |
  Your previous answer is invalid (errors in French):
  $error
  Fix these errors and send the complete JSON object again, and only it.
