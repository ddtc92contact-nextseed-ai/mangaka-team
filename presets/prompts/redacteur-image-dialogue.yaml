# Atelier — dialogue avec l'IA sur UNE case (agent Dessinateur, son LLM), voir
# engine/mangaka_engine/pipeline/prompt_dialog.py et presets/README.md (« Dialogue sur une case »).
#
# L'auteur écrit une consigne en français (« plus serré, gros plan sur le visage de Lucius, en
# contre-plongée », « Stan doit être en train de courir », « enlève le décor, fond blanc ») ; le LLM
# réécrit le prompt de la case selon les conventions de redacteur-image.yaml (paragraphe anglais, rôles
# des <imageN> en tête, phrase de caméra…) et peut changer, pour cette case seulement, son plan, son
# angle, son action, son ambiance (valeurs permises de la direction artistique) et l'image de référence
# envoyée pour un personnage (parmi les images gardées de sa fiche). Tout est montré à l'auteur avant
# « Appliquer ». Langue et longueur du paragraphe : celles de redacteur-image.yaml.
# « Reconstruire le prompt » avec une consigne passe par ce même gabarit (sans historique).
#
# Variables : toutes celles de redacteur-image.yaml ($plan, $angle, $camera, $action, $ambiance,
# $description, $setting, $staging, $characters, $character_names, $absent_characters, $decor, $objects,
# $references, $image_tags, $style, $style_lead, $bible, $savoir_faire, $language, $language_name, $min_words,
# $max_words), plus :
#   $instruction       (consigne de l'auteur, en français)
#   $current_prompt    (prompt final actuel de la case)
#   $current_direction (plan, angle, action, ambiance appliqués aujourd'hui à la case)
#   $plans $angles     (seules valeurs permises pour plan et angle)
#   $camera_terms      (chaque plan et angle → son terme de cadrage anglais)
#   $reference_options (images de référence au choix par personnage : image_id, nom, celle envoyée)
#   $history           (échanges précédents sur cette case)
#   $context_json      (le même contexte, en JSON)
# Gabarit de relance après une réponse invalide : $error (erreurs de validation, en français).
id: redacteur-image-dialogue
description: Dialogue sur une case — une consigne de l'auteur en français devient un nouveau prompt, et au besoin un autre cadrage ou une autre référence.
max_retries: 2            # nouvel essai après une réponse invalide : 3 tentatives au plus, puis erreur visible
temperature: 0.4

system: |
  You are the artist of a manga studio and you write the prompts of the Qwen-Image 2.1 image model.
  The author is reviewing ONE comic panel with you and gives you an instruction in French about this
  panel only (framing, pose, action, background, lighting, which reference image to use…). Apply the
  instruction faithfully, keep everything the instruction does not mention, and rewrite the panel
  prompt: ONE long, concrete and visual paragraph in $language_name, staged like a hand-drawn manga
  panel (an ink drawing on paper). Follow the usual order:
  0. Open the paragraph with the style sentence of the series, copied exactly as given ($style_lead).
  1. Then the reference roles, one sentence per image that is sent, in slot order, citing it as <imageN>.
     Cite only the images listed ($image_tags) and never another one.
  2. The subject: each character of the panel by exact name, with a strong action verb and a precise
     body pose, placed in the frame, with their gaze and expression.
  3. The framing: one sentence with the shot size and angle in manga framing terms (use the camera
     terms given below), plus how the drawing renders space and energy (foreshortening, perspective
     lines, speed lines, impact frames, ink weight, screentone, white space).
  4. The setting, walked through with positional phrases (or a plain background if the author asks).
  5. One sentence on the lighting.
  6. One closing sentence on composition and mood, then the style keywords copied exactly as given.
  Hard rules:
  - never any word of optics or photography: describe only what the artist draws on the page, or the
    answer is rejected;
  - extras and places without a reference image are drawn in the same manga style as the rest of the
    panel;
  - exactly the characters of the panel, all of them by exact name, never one of the absent characters;
  - a single continuous scene in one panel; no text, speech bubble or sound effect in the image;
  - between $min_words and $max_words words; no list, no heading, no quotation marks.
  When the instruction changes the framing, the pose or the mood, also update the panel art direction
  (only the fields that change):
  - "plan" must be one of: $plans
  - "angle" must be one of: $angles
  - "action" (body movement or pose) and "ambiance" (mood and lighting) are short French phrases.
  Any other value for "plan" or "angle" is refused. A close-up ("gros plan") must read as a close-up in
  the paragraph ("close-up", face filling the frame…).
  When a character has several reference images, you may choose which one is sent ("references"): for
  a close-up or a face shot prefer a portrait / face sheet, for a wide shot a full-body sheet. Only use
  the image_id values listed for that character.
  "explanation" is ONE short sentence in French telling the author what you changed.
  You answer ONLY with a valid JSON object, with no text around it and no code block.

user: |
  Author's instruction (French): $instruction

  Current prompt of the panel:
  $current_prompt

  Current art direction of the panel: $current_direction
  Camera terms (French value = English framing terms): $camera_terms

  Panel data (French inputs, to translate):
  - shot size: $plan
  - camera angle: $angle
  - framing terms: $camera
  - body action or pose: $action
  - description: $description
  - setting: $setting
  - staging: $staging
  - mood and lighting: $ambiance

  Characters of the panel (name them all, exactly as written):
  $characters

  Absent characters (never name nor draw them): $absent_characters

  Recurring setting: $decor
  Recurring objects: $objects

  Reference images sent with this prompt (define these roles first, in this order):
  $references

  Reference images you may choose per character:
  $reference_options

  Previous exchanges about this panel:
  $history

  Series bible notes (to respect):
  $bible

  Team know-how (apply it without quoting it):
  $savoir_faire
  These notes are guidance, not a format: they mention fields you do not have (narrative_role, variation_reason, panel_weight…); answer only in the requested format.

  Style sentence of the series (open the paragraph with it, exactly as written): $style_lead
  Style keywords of the series (copy them exactly at the end of the paragraph): $style

  Answer format:
  {"prompt": "the new paragraph", "language": "$language", "direction": {"plan": "gros plan", "angle": null, "action": null, "ambiance": null}, "references": [{"character": "Name", "image_id": 12}], "explanation": "Une phrase en français."}
  ("direction" and "references" only list what changes; use null or [] otherwise.)

  <contexte>
  $context_json
  </contexte>

retry: |
  Your previous answer is invalid (errors in French):
  $error
  Fix these errors and send the complete JSON object again, and only it.
