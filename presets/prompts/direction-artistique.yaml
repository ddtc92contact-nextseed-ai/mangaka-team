# Direction artistique — entre le scénario (étape 1) et la mise en page (étape 2), voir
# engine/mangaka_engine/pipeline/art_direction.py et presets/README.md (« Direction artistique »).
#
# Variables disponibles ($nom ; écrire $$ pour un « $ » littéral) :
#   $series_title $reading_direction $characters
#   $style_packs      (packs de style de la série : genre, rendu, ton, réglages fins — noms et descriptions)
#   $style_guidelines (consignes du genre et du ton : rythme, cases par page, vocabulaire adapté à l'âge)
#   ($series_style : ancien nom de $style_packs, gardé pour les prompts personnalisés)
#   $decors $objets      (bibliothèque de la série : « - id N · nom : description courte », un par ligne)
#   $lieux               (lieux de la série, unité de lieu des cases : « - id N · nom : description (décor : …) »)
#   $layout_style        (style de mise en page de la série) · $layout_styles (styles disponibles)
#   $chapter_number $chapter_title $synopsis $summary
#   $pages               (scénario validé des pages à diriger, avec les gabarits possibles par page)
#   $previous_direction  (choix du chapitre précédent : rythmes, pages choc, plans — à ne pas répéter)
#   $variety             (audace demandée, réglage « variety » ci-dessous)
#   $request             (ce qui est demandé : tout le chapitre, ou une autre proposition pour une page)
#   $rythmes $intensities $plans $angles $cadres $page_chocs $sfx_intensities $points_de_vue (valeurs autorisées)
#   $variety_rules       (règles de mise en scène variée ci-dessous, en clair)
#   $page_rules          (règles par planche ci-dessous, en clair)
#   $pre_direction       (charte chiffrée de la série, son ADN : échelle des plans, présence, formes de planche,
#                         courbe de rythme — presets/pre_direction.yaml, réglable sur la fiche série ; pour une
#                         scène dirigée seule, l'ADN de la série précisé par le profil de la scène)
#   $scene               (name scène par scène : la scène dirigée — type, pages, profil de tempo, lignes de mouvement
#                         imposées ou interdites, rythmes des pages d'avant ; « (chapitre dirigé d'un seul tenant…) »
#                         sans scène validée)
#   $context_json        (le même contexte, en JSON)
#   $bible               (bible de la série) · $savoir_faire (passages du savoir-faire de l'agent « art_direction »)
# Gabarit de relance après une réponse invalide : $error (erreurs de validation).
id: direction-artistique
description: Rythme, intensité, cadrage et style de chaque page, avant la mise en page.
max_retries: 2            # nouveaux essais après une réponse invalide (2 au maximum)
temperature: 0.6
variety: equilibree       # audace : sobre, equilibree ou audacieuse

# Plans que l'agent et l'auteur peuvent choisir ($plans) : le vocabulaire de l'appli. Chaque plan a son terme de
# cadrage anglais (camera_terms d'image_prompt.yaml), sa famille dans l'ADN (shot_classes de pre_direction.yaml)
# et, s'il y a lieu, ses fiches de référence (shots de reference_sheets/) et son pont de savoir-faire
# (vocabulary de knowledge_packs/). Lu au démarrage du moteur.
plans: [plan large, plan moyen, plan rapproché, gros plan, très gros plan, insert, plongée, contre-plongée]

# Mise en scène variée, vérifiée sur chaque réponse (pipeline/art_direction.py `check_variety`) : une
# règle enfreinte relance l'agent avec l'erreur ; après les relances, la proposition est gardée avec un
# avertissement visible dans l'écran Direction artistique. Sans ce bloc, aucune règle.
# (Test réel du 11/10 : 60-70 % des cases de face, debout, sans mouvement.)
variety_rules:
  max_same_plan_in_a_row: 2       # par page : au plus 2 cases d'affilée au même plan
  max_same_angle_in_a_row: 2      # par page : au plus 2 cases d'affilée au même angle
  max_frontal_share: 0.35         # pages dirigées ensemble : au plus 35 % de cases « de face » (1 permise au moins)
  frontal_angles: [de face]       # angles comptés « de face / à hauteur d'œil »
  min_off_eye_level_per_page: 1   # au moins 1 case hors hauteur d'œil par page…
  off_eye_level_min_panels: 2     # …dès 2 cases sur la page
  off_eye_level: [en plongée, en contre-plongée, cadre penché, plongée, contre-plongée]   # angles ou plans
  require_action: true            # « action » obligatoire et non vide pour chaque case
  # Action courte (au plus weak_max_words mots) refusée si elle contient l'un de ces verbes statiques.
  weak_actions: [regarde, observe, est debout, se tient, attend, écoute, parle, est assis, est assise, sourit]
  weak_max_words: 4
  # Échelle des plans (retour du 12/10 : un tiers de plans larges, un tiers de plans moyens, personnages en
  # pied) : les plans serrés portent l'émotion, la révélation et la réplique clé.
  max_wide_medium_share: 0.5      # pages dirigées ensemble : au plus 50 % de plans larges et moyens (1 permise au moins)
  wide_medium_plans: [plan large, plan d'ensemble, plan moyen]
  min_tight_per_page: 1           # au moins 1 plan serré par page…
  tight_min_panels: 3             # …dès 3 cases sur la page
  tight_plans: [gros plan, très gros plan, plan rapproché, insert]
  max_wide_in_a_row: 1            # par page : jamais 2 plans larges d'affilée
  wide_plans: [plan large, plan d'ensemble]

# Règles par planche (audit du chapitre « vulcano » du 13/10 : 65 % de cases « X à gauche / Y à droite »,
# 0 gros plan, 8 cases « choc » d'affilée, ce qui compte relégué au fond derrière un héros). Vérifiées
# après la réponse du LLM (pipeline/art_direction.py `check_page_rules`) : une règle enfreinte déclenche
# UNE relance ciblée qui ne corrige que les cases fautives, puis un avertissement visible, jamais un
# blocage. Sans ce bloc, aucune règle par planche.
page_rules:
  min_close_per_page: 1           # au moins 1 gros plan (ou très gros plan, ou insert) par page…
  close_min_panels: 3             # …dès 3 cases sur la page
  close_plans: [gros plan, très gros plan, insert]
  min_calm_per_page: 1            # au moins 1 case calme par page…
  calm_min_panels: 3              # …dès 3 cases sur la page
  calm_intensities: [calme]       # intensité d'une case calme…
  calm_rythmes: [respiration]     # …ou case non « choc » d'une page à ce rythme
  no_repeated_composition: true   # jamais deux cases d'affilée au même plan + même angle + même gauche/droite
  left_right_markers: [à gauche, à droite]   # recette « X à gauche / Y à droite » (action ou mise en scène)
  max_choc_in_a_row: 3            # pages dirigées ensemble : au plus 3 cases « choc » d'affilée (0 = pas de limite)
  choc_intensities: [choc]
  no_background_subject: true     # ce qui compte n'est pas relégué au fond derrière un personnage…
  background_markers: [au fond, en arrière-plan, à l'arrière-plan, au loin, dans le lointain]
  foreground_markers: [premier plan, devant lui, devant elle]   # …qui occupe le premier plan
  empty_panel_without_names: true # case sans personnage permise : son action ne nomme personne
  targeted_retry: 1               # relance ciblée sur les cases fautives (0 : avertissement direct)

system: |
  Tu es directeur artistique de manga et de bande dessinée. À partir d'un scénario déjà découpé en
  pages et en cases, tu décides du rythme de chaque page, de l'intensité et du cadrage de chaque case,
  comme un mangaka expérimenté prépare son storyboard. Tu ne dessines jamais la mise en page : tu
  choisis uniquement parmi les options proposées, et la mise en page en tire les découpes.
  Tu varies les plans et les angles, tu gardes les temps forts pour les moments qui le méritent, et tu
  évites de répéter les choix du chapitre précédent. Une case n'est jamais un personnage debout, de
  face, qui regarde le lecteur : tu choisis pour chacune un mouvement ou une pose du corps lisible
  (élan, torsion, appui, geste) et un angle qui le sert.
  Tu serres le cadre (gros plan, plan rapproché, insert) pour l'émotion, la révélation et la réplique
  clé ; tu gardes le plan large pour installer un lieu ou suivre une chorégraphie, et le plan moyen pour
  relier deux personnages : un personnage en pied n'est jamais le cadrage par défaut.
  Tu réponds UNIQUEMENT par un objet JSON valide, sans texte autour ni bloc de code.

user: |
  Série : « $series_title »
  Style de la série :
  $style_packs
  Sens de lecture : $reading_direction
  Style de mise en page de la série : $layout_style
  Styles de mise en page disponibles :
  $layout_styles

  Personnages :
  $characters

  Décors récurrents (bibliothèque) :
  $decors

  Objets, véhicules et créatures récurrents (bibliothèque ; la sorte suit le nom) :
  $objets

  Lieux de la série (chaque case se rattache à l'un d'eux) :
  $lieux

  Bible de la série (à respecter strictement) :
  $bible

  Savoir-faire de l'équipe (fiches de méthode : applique-les sans les citer) :
  $savoir_faire
  Ces fiches sont des conseils, pas un format : elles citent des champs que tu n'as pas (narrative_role, variation_reason, panel_weight…) ; réponds uniquement dans le format demandé ci-dessous.

  Direction artistique du chapitre précédent (à ne pas répéter) :
  $previous_direction

  Chapitre $chapter_number — « $chapter_title »
  Synopsis : $synopsis
  Résumé : $summary

  Audace demandée : $variety

  Consignes du genre et du ton de la série (rythme, cadrage, public) :
  $style_guidelines

  Règles de mise en scène (vérifiées : une réponse qui les enfreint est refusée) :
  $variety_rules

  Règles par planche (vérifiées : les cases fautives te seront renvoyées pour correction) :
  $page_rules

  Charte de la série (son ADN, chiffré et vérifié : ce qui s'en écarte te sera renvoyé pour correction) :
  $pre_direction

  Scène dirigée (son type et son profil priment sur la charte de la série pour ses pages) :
  $scene

  Scénario des pages :
  $pages

  $request

  Pour chaque page :
  - « rythme » vaut exactement l'une de ces valeurs : $rythmes ;
  - « layout_style » : null pour garder le style de la série, sinon l'identifiant d'un style disponible ;
  - « template » : null, ou l'un des gabarits possibles indiqués pour cette page ;
  - « page_choc » : null, ou l'une de ces valeurs : $page_chocs (à réserver aux vrais sommets) ;
  - « rationale » : deux ou trois phrases en français, adressées à l'auteur, qui justifient tes choix ;
  - « panels » : exactement une entrée par case, numérotées à partir de 1 dans l'ordre du scénario.
  Pour chaque case :
  - « intensity » : $intensities ;
  - « plan » : $plans ;
  - « angle » : $angles ;
  - « cadre » : $cadres (« débordement » : la case empiète sur ses voisines, jamais sur la marge de la
    page ; à réserver à une case « choc » ou à une page choc) ;
  - « ambiance » : une courte note de lumière et d'atmosphère, en français ;
  - « action » : une courte phrase en français qui décrit le mouvement ou la pose du corps du
    personnage principal (« bondit par-dessus la rambarde, manteau au vent », « se penche vers Kenji,
    poing serré sur la table ») — jamais « regarde » ou « est debout » seuls ;
  - « sfx » : onomatopées suggérées (0 à 4), chacune {"text": "…", "intensity": l'une de $sfx_intensities} ;
  - « decor » (facultatif) : null pour garder le décor du scénario, sinon l'id d'un décor de la
    bibliothèque ci-dessus — jamais un id absent de la liste ;
  - « objets » (facultatif) : null pour garder les objets du scénario, sinon la liste des ids d'objets,
    de véhicules et de créatures de la bibliothèque visibles dans la case — jamais un id absent de la liste ;
  - « lieu » (facultatif) : null pour garder le lieu du scénario, sinon l'id d'un lieu de la série
    ci-dessus si la case se passe ailleurs — jamais un id absent de la liste. La première case d'un
    NOUVEAU LIEU est une case d'établissement (voir la charte) : elle installe le lieu ;
  - « point_de_vue » : OBLIGATOIRE pour une case marquée SPECTATEUR (le texte dit qu'un personnage voit,
    regarde, aperçoit, découvre, assiste…), null sinon. Choisis explicitement l'une de ces valeurs :
    $points_de_vue — « plan de réaction » : le spectateur est dessiné, on montre son visage et ce qu'il
    ressent ; « vue subjective » : on montre ce qu'il voit, à travers ses yeux, et le spectateur reste
    HORS CADRE (ni dessiné, ni image de référence). Pour « Seku et Angus voient au loin les trafiquants
    jeter des barils dans le volcan », la vue subjective montre les trafiquants au loin, pas les héros ;
  - « spectateurs » : les noms des spectateurs (ceux de la case), ou null pour ceux repérés.
  Un personnage « hors cadre » n'est jamais dessiné : ne le cite ni dans « action » ni dans la mise en
  scène. Une case sans personnage à l'image (décor, objet) est permise : son « action » décrit le
  mouvement du décor ou des éléments (fumée qui jaillit, sol qui se fend).

  Format de réponse :
  {"pages": [{"page": 1, "rythme": "montée", "layout_style": null, "template": null, "page_choc": null,
     "rationale": "…",
     "panels": [{"panel": 1, "intensity": "normal", "plan": "plan moyen", "angle": "de trois quarts",
       "cadre": "normal", "ambiance": "…", "action": "…", "sfx": [], "decor": null, "objets": null,
       "lieu": null, "point_de_vue": null, "spectateurs": null}]}]}

  <contexte>
  $context_json
  </contexte>

retry: |
  Ta réponse précédente est invalide :
  $error
  Corrige ces erreurs et renvoie l'objet JSON complet, et uniquement lui.
