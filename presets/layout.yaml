# Paramètres de l'étape 2 (découpage / mise en page), communs à tous les formats.

# Taille minimale (mm) d'une case quand on déplace une gouttière dans l'interface.
min_panel_mm: 20

# Case qui « déborde sur les cases voisines » (option imposée dans l'atelier, ou par la direction
# artistique sur une page choc / une case choc) : ses bords franchissent la gouttière et avancent
# encore de break_out_mm sur les cases voisines. Rien ne franchit jamais la marge extérieure (zone utile du format).
break_out_mm: 6

# Taille cible des images générées pour une case : même ratio que la case,
# surface ≈ megapixels, côtés arrondis à un multiple de `multiple` (contrainte du modèle).
generation:
  megapixels: 1.0
  multiple: 16
  min_side: 256

# Zone réservée aux bulles, placée en haut de la case, du côté où commence la lecture
# (gauche en ltr, droite en rtl). Sa surface dépend de la longueur des dialogues :
# min_fraction de la case pour une réplique très courte → max_fraction à partir de full_at_chars.
# max_fraction : jamais plus de la moitié de la case (règle de la name) ; 0,5 depuis les répliques de 22 mots
# (15/10 : à 0,4, deux répliques de 15 mots débordaient d'une case de planche à 6 cases).
bubble_zone:
  padding_mm: 2
  min_fraction: 0.10
  max_fraction: 0.50
  full_at_chars: 240
  width_fraction: 0.55   # largeur de départ (part de la largeur de la case)
  max_height_fraction: 0.60
  # Surface que demandent vraiment les bulles au lettrage (mm², indépendante de la taille de la case) :
  # chaque bulle + chaque caractère. La zone vaut au moins cela (toujours bornée à max_fraction), sinon
  # deux répliques courtes débordaient déjà d'une case de planche à 6 cases (mesure du 13/10, A4 300 DPI).
  bubble_mm2: 1100
  char_mm2: 12

# Une case garde son image quand seule sa géométrie change (biais, gouttière) : l'image est
# recadrée au polygone. La régénération n'est conseillée que si le ratio de la boîte englobante de
# la case s'écarte de plus de `ratio_threshold` (fraction) de celui de l'image retenue.
regeneration:
  ratio_threshold: 0.15
