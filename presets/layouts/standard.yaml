# Bibliothèque de gabarits de planche.
#
# Un gabarit est un arbre de découpes « guillotine » :
#   panel                         une case
#   { rows: [2, 1], children: [...] }   bandes empilées de haut en bas (poids relatifs)
#   { cols: [1, 1], children: [...] }   cases côte à côte, dans le SENS DE LECTURE
#                                       (gauche → droite en ltr, miroir automatique en rtl)
# `children` absent = uniquement des cases. L'ordre de lecture est l'ordre de parcours.
# À nombre de cases égal, le moteur choisit le gabarit dont la répartition des surfaces
# colle le mieux à l'importance (1–3) des cases ; en cas d'égalité, le premier de la liste.
templates:
  - id: 1-pleine-page
    name: Pleine page
    tree: panel

  - id: 2-bandes
    name: Deux bandes égales
    tree: { rows: [1, 1] }
  - id: 2-grand-haut
    name: Grande case en haut
    tree: { rows: [2, 1] }
  - id: 2-grand-bas
    name: Grande case en bas
    tree: { rows: [1, 2] }
  - id: 2-colonnes
    name: Deux colonnes
    tree: { cols: [1, 1] }

  - id: 3-bandes
    name: Trois bandes
    tree: { rows: [1, 1, 1] }
  - id: 3-grand-haut
    name: Grande case en haut + deux cases
    tree: { rows: [3, 2], children: [panel, { cols: [1, 1] }] }
  - id: 3-grand-bas
    name: Deux cases + grande case en bas
    tree: { rows: [2, 3], children: [{ cols: [1, 1] }, panel] }
  - id: 3-grand-cote
    name: Grande case verticale + deux cases
    tree: { cols: [3, 2], children: [panel, { rows: [1, 1] }] }

  - id: 4-grille
    name: Grille 2 × 2
    tree: { rows: [1, 1], children: [{ cols: [1, 1] }, { cols: [1, 1] }] }
  - id: 4-grand-haut
    name: Grande case en haut + trois cases
    tree: { rows: [3, 2], children: [panel, { cols: [1, 1, 1] }] }
  - id: 4-bandeau-central
    name: Deux cases, bandeau, case finale
    tree: { rows: [1, 1.4, 1], children: [{ cols: [1, 1] }, panel, panel] }
  - id: 4-grand-bas
    name: Trois cases + grande case en bas
    tree: { rows: [1, 1, 2], children: [{ cols: [1, 1] }, panel, panel] }

  - id: 5-classique
    name: Classique 2 + 1 + 2
    tree: { rows: [1, 1.3, 1], children: [{ cols: [1, 1] }, panel, { cols: [1, 1] }] }
  - id: 5-grand-haut
    name: Grande case en haut + 2 × 2
    tree: { rows: [2.2, 1, 1], children: [panel, { cols: [1, 1] }, { cols: [1, 1] }] }
  - id: 5-grand-cote
    name: Deux cases + grande case verticale
    tree:
      rows: [1, 2]
      children:
        - { cols: [1, 1] }
        - { cols: [1.4, 1], children: [panel, { rows: [1, 1] }] }

  - id: 6-grille
    name: Grille 3 × 2
    tree: { rows: [1, 1, 1], children: [{ cols: [1, 1] }, { cols: [1, 1] }, { cols: [1, 1] }] }
  - id: 6-grand-haut
    name: Grande case en haut + 3 + 2
    tree: { rows: [2, 1, 1], children: [panel, { cols: [1, 1, 1] }, { cols: [1, 1] }] }

  - id: 7-dense
    name: Dense 2 + 3 + 2
    tree: { rows: [1, 1, 1], children: [{ cols: [1, 1] }, { cols: [1, 1, 1] }, { cols: [1, 1] }] }
  - id: 8-dense
    name: Dense 4 × 2
    tree: { rows: [1, 1, 1, 1], children: [{ cols: [1, 1] }, { cols: [1, 1] }, { cols: [1, 1] }, { cols: [1, 1] }] }
  - id: 9-grille
    name: Grille 3 × 3
    tree: { rows: [1, 1, 1], children: [{ cols: [1, 1, 1] }, { cols: [1, 1, 1] }, { cols: [1, 1, 1] }] }
# Au-delà, le moteur génère une grille de bandes de 3 cases (gabarit « auto-N »).
