# FLUX 3 Image Klein · Qualité — texte → image (BFL, poids ouverts, distillé).
# Écrit par Morigane le 16/10/2026. Même graphe que le flux avec références, sans le nœud
# ReferenceMultiLatent : c'est celui-ci qui sert quand aucune fiche n'est citée par la case.
#
# `with_references` ci-dessous renvoie à la variante avec références du MÊME palier : une case
# qui cite un personnage à fiche bascule automatiquement dessus, comme pour Qwen. C'est le
# mécanisme qui permet de choisir FLUX au niveau d'une série et de laisser le moteur router
# chaque case selon ses fiches.
#
# LICENCE : FLUX Kommunity v1.0 — non commercial, exception commerciale sous 5 M$ de revenus,
# pas de fine-tuning/LoRA, pas de redistribution commerciale des poids.
id: flux3-klein-qualite
engine: flux3-klein
name: "FLUX 3 Klein · Qualité — texte → image"
description: >-
  Palier Qualité de FLUX 3 Image Klein (distillé, bf16) : 15 pas, cfg 2,5, er_sde/simple. Papier nettement plus clair que Qwen et pas de texte parasite en 7 cases mesurées ; aucun LoRA (licence), donc pas de style de série ni d'identité renforcée par LoRA.
distilled: false   # voir la note du flux avec références : cfg 2,5 est lu et mesuré meilleur que cfg 1
workflow_file: flux3-klein-qualite.json
output_node: "9"
timeout_s: 1800
with_references: flux3-klein-edit-ref-qualite
from_sketch: flux3-klein-qualite-from-sketch   # « Passer au propre » depuis un croquis validé
# Croquis et « Régénérer en Qualité » d'une série (ou d'une case) FLUX restent sur FLUX : sans ces liens,
# ce seraient ceux de defaults.yaml (Qwen). Pas de palier « Qualité max » : 30 pas n'apportent rien (mesuré).
sketch: flux3-klein-croquis
quality: flux3-klein-qualite
tier:
  name: Qualité
  choice: "FLUX 3 Klein · Qualité (sans LoRA, ~1 min 30 par case)"   # libellé du palier dans la fiche série
  order: 5
estimated_s: 90
mapping:
  positive_prompt: { node: "4", input: text }
  negative_prompt: { node: "5", input: text }
  seed: { node: "7", input: seed }
  steps: { node: "7", input: steps }
  cfg: { node: "7", input: cfg }
  width: { node: "12", input: width }
  height: { node: "12", input: height }
  filename_prefix: { node: "9", input: filename_prefix }
defaults:
  negative_prompt: "text, letters, speech bubble, caption, watermark, signature, multiple panels, comic page layout, collage, split screen, character sheet, turnaround, model sheet, white background, duplicate character, extra people, extra limbs, deformed hands, blurry, low quality"
  steps: 15
  cfg: 2.5
  width: 1024
  height: 1024
  filename_prefix: mangaka/case
trial:
  positive_prompt: >-
    manga panel, black and white ink, screentone shading, a young swordswoman standing on a
    rooftop at dusk, wind in her hair, dynamic angle
  width: 512
  height: 512
  steps: 8
  filename_prefix: mangaka/essai
