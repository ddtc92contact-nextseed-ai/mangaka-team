# FLUX 3 Image Klein · Qualité — avec images de référence (BFL, poids ouverts, distillé).
# Écrit par Morigane le 16/10/2026, après la campagne « vignette par vignette » sur OSU chapitre 1 :
# 7 cases jugées par le contrôle qualité de l'appli (voir ~/mangaka-comfy-exports/flux3-test/).
#
# Graphe repris du workflow officiel BFL (image_flux3_klein_distilled_image_edit.json) :
# UNETLoader + CLIPLoader type « flux3 » + VAE FLUX 2 — le VAE est OBLIGATOIRE, sans lui les
# références sont ignorées en silence. Les références passent par ReferenceMultiLatent, dont les
# entrées d'images sont auto-extensibles (images.image0, images.image1, …) : ici 5 emplacements,
# comme les presets Qwen livrés. Un emplacement vide est retiré avec son entrée — l'auto-extensibilité
# fait le reste.
#
# PIÈGE CONNU (payé en test) : dans l'API ComfyUI, une référence doit être branchée sur la clé
# POINTÉE « images.imageN ». Une forme imbriquée ({"images": {"image0": …}}) est acceptée sans
# erreur et silencieusement ignorée — c'est ce JSON-là qui les branche correctement.
#
# LICENCE : FLUX Kommunity v1.0 — non commercial, exception commerciale sous 5 M$ de revenus,
# pas de fine-tuning/LoRA, pas de redistribution commerciale des poids.
id: flux3-klein-edit-ref-qualite
engine: flux3-klein
name: "FLUX 3 Klein · Qualité — avec images de référence"
description: >-
  FLUX 3 Image Klein (distillé, bf16) guidé par jusqu'à 5 images de référence des personnages, une par emplacement dans l'ordre. 15 pas, cfg 2,5, er_sde/simple. Mesuré 1,5 à 3 fois plus rapide que le palier Qualité Qwen avec les mêmes références, pour un papier nettement plus clair.
# Distillé au sens de BFL (entraîné sans guidage, 16 pas nominaux) — mais contrairement à Turbo,
# ce point de contrôle LIT le négatif dès que cfg > 1 : mesuré le 16/10, même cas, même graine,
# score qualité 96 ok à cfg 2,5 contre 68 rejeté à cfg 1 (zone de texte parasite) et papier plus
# clair (39 % → 15 % de pixels sombres). On le déclare donc non distillé pour autoriser cfg 2,5,
# qui est aussi le réglage validé à l'œil par David. L'autre voie serait d'assouplir check_cfg.
distilled: false
workflow_file: flux3-klein-edit-ref-qualite.json
output_node: "9"
# Une case à 1152x864 avec 2 références : 38 s mesuré ; à 0,25 Mpx de références : 19 s.
timeout_s: 1800
from_sketch: flux3-klein-edit-ref-qualite-from-sketch   # « Passer au propre » depuis un croquis validé
sketch: flux3-klein-croquis     # croquis FLUX (son with_references pour les cases avec fiches)
quality: flux3-klein-qualite    # « Régénérer en Qualité » FLUX (idem)
tier:
  name: Qualité
estimated_s: 120
mapping:
  positive_prompt: { node: "4", input: text }
  negative_prompt: { node: "5", input: text }
  seed: { node: "7", input: seed }
  steps: { node: "7", input: steps }
  cfg: { node: "7", input: cfg }
  width: { node: "12", input: width }
  height: { node: "12", input: height }
  filename_prefix: { node: "9", input: filename_prefix }
# Emplacements d'images de référence (LoadImage), remplis dans l'ordre et branchés sur les entrées
# images.image0…4 du nœud 6. Un emplacement inutilisé est retiré par le moteur, et son entrée
# images.imageN disparaît avec lui : rien d'autre à retirer.
reference_images:
  - { node: "20", input: image }
  - { node: "21", input: image }
  - { node: "22", input: image }
  - { node: "23", input: image }
  - { node: "24", input: image }
# Aucun point d'insertion LoRA : la licence FLUX Kommunity interdit le fine-tuning et la
# redistribution. Les LoRA de style et d'identité de la série ne s'appliquent donc pas ici —
# c'est le prix de ce moteur, à mettre en face de son gain de vitesse.
defaults:
  negative_prompt: "text, letters, speech bubble, caption, watermark, signature, multiple panels, comic page layout, collage, split screen, character sheet, turnaround, model sheet, white background, duplicate character, extra people, extra limbs, deformed hands, blurry, low quality"
  steps: 15
  cfg: 2.5
  width: 1024
  height: 1024
  filename_prefix: mangaka/case
trial:
  positive_prompt: >-
    manga panel, black and white ink, screentone shading, a young swordswoman standing on a
    rooftop at dusk, wind in her hair, dynamic angle
  width: 512
  height: 512
  steps: 8
  filename_prefix: mangaka/essai
