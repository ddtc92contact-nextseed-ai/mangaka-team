# FLUX 3 Image Klein · Qualité · grille de composition — texte → image (BFL, poids ouverts, distillé).
# Dérivé de flux3-klein-qualite (même modèle, mêmes réglages : 15 pas, cfg 2,5, er_sde/simple) : seul le
# prompt positif change de chemin. Le paragraphe entre dans Flux3LayoutPrompt (nœud 31), qui lui ajoute la
# table des boîtes produites par CreateBoundingBoxes (nœud 30) ; c'est cette sortie qu'encode le nœud 4.
# Nœuds et entrées lus dans le ComfyUI installé (comfy_extras/nodes_bounding_boxes.py et nodes_flux.py) et
# dans le modèle officiel image_flux3_klein_distilled_t2i.json :
#   CreateBoundingBoxes : width, height, editor_state (boîtes en pixels) → sorties preview, bboxes, elements (2)
#   Flux3LayoutPrompt   : prompt, element (← elements) → prompt
#
# Le moteur écrit une boîte par personnage pour une case à 2 personnages ou plus (positions tirées de la mise
# en scène, sinon réparties dans l'ordre de la distribution) ; sinon la liste reste vide et Flux3LayoutPrompt
# renvoie le paragraphe tel quel. Voir pipeline/prompt_layout.py et presets/README.md (« Grille de composition »).
#
# PIÈGE CONNU : dans le format API, une liste en entrée est lue comme un lien [nœud, sortie]. Les boîtes passent
# donc enveloppées, {"__value__": [...]}, comme le fait le frontend de ComfyUI — le moteur s'en charge.
#
# Pas proposé comme palier de série (aucun tier.choice) : le gain de la grille n'est pas encore mesuré. Le
# choisir sur une case, ou comparer les deux formats avec le banc `python -m mangaka_engine.bench.flux_layout`.
#
# LICENCE : FLUX Kommunity v1.0 — non commercial, exception commerciale sous 5 M$ de revenus,
# pas de fine-tuning/LoRA, pas de redistribution commerciale des poids.
id: flux3-klein-qualite-layout
engine: flux3-klein
name: "FLUX 3 Klein · Qualité · grille — texte → image"
description: >-
  FLUX 3 Klein · Qualité avec la grille de composition à boîtes de BFL : une boîte par personnage (position et courte description) pour les cases à plusieurs personnages, le paragraphe seul sinon. À l'essai : gain non mesuré face au paragraphe.
distilled: false   # comme flux3-klein-qualite : cfg 2,5 mesuré meilleur que cfg 1
prompt_format: layout
workflow_file: flux3-klein-qualite-layout.json
output_node: "9"
timeout_s: 1800
with_references: flux3-klein-edit-ref-qualite-layout
from_sketch: flux3-klein-qualite-from-sketch   # « Passer au propre » : paragraphe seul (pas de grille sur l'image → image)
sketch: flux3-klein-croquis
quality: flux3-klein-qualite-layout
tier:
  name: Qualité
estimated_s: 90
mapping:
  positive_prompt: { node: "31", input: prompt }
  negative_prompt: { node: "5", input: text }
  seed: { node: "7", input: seed }
  steps: { node: "7", input: steps }
  cfg: { node: "7", input: cfg }
  width: { node: "12", input: width }
  height: { node: "12", input: height }
  filename_prefix: { node: "9", input: filename_prefix }
# Grille de composition : boîtes et taille de la case (la même que le latent).
layout:
  boxes: { node: "30", input: editor_state }
  width: { node: "30", input: width }
  height: { node: "30", input: height }
defaults:
  negative_prompt: "text, letters, speech bubble, caption, watermark, signature, multiple panels, comic page layout, collage, split screen, character sheet, turnaround, model sheet, white background, duplicate character, extra people, extra limbs, deformed hands, blurry, low quality"
  steps: 15
  cfg: 2.5
  width: 1024
  height: 1024
  filename_prefix: mangaka/case
trial:
  positive_prompt: >-
    manga panel, black and white ink, screentone shading, a young swordswoman standing on a
    rooftop at dusk, wind in her hair, dynamic angle
  width: 512
  height: 512
  steps: 8
  filename_prefix: mangaka/essai
