id: flux3-klein-edit-ref-qualite-layout
engine: flux3-klein
name: "FLUX 3 Klein · Qualité · grille — avec images de référence"
description: >-
  FLUX 3 Klein · Qualité avec références (jusqu'à 5 fiches) et la grille de composition à boîtes de BFL : une boîte par personnage pour les cases à plusieurs personnages, le paragraphe seul sinon. À l'essai : gain non mesuré face au paragraphe.
distilled: false
prompt_format: layout
workflow_file: flux3-klein-edit-ref-qualite-layout.json
output_node: "9"
timeout_s: 1800
from_sketch: flux3-klein-edit-ref-qualite-from-sketch
sketch: flux3-klein-croquis
quality: flux3-klein-qualite-layout
tier:
