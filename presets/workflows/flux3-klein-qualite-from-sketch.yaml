# FLUX 3 Image Klein · Qualité — propre depuis un croquis validé (image → image).
# Écrit par Morigane le 16/10/2026. Passage au propre : le croquis validé de la case est agrandi à
# la taille finale (nœud 31, ImageScale), encodé par le VAE (nœud 32) puis débruité partiellement
# (`denoise`, nœud 7) avec la même graine et le même prompt que le croquis → même cadrage, mêmes
# poses, détails propres. Même modèle et même encodeur que « flux3-klein-qualite » ; seul le latent
# de départ change (EmptyFlux2LatentImage remplacé par LoadImage → ImageScale → VAEEncode).
id: flux3-klein-qualite-from-sketch
engine: flux3-klein
name: "FLUX 3 Klein · Qualité — propre depuis croquis (sans référence)"
description: >-
  Passage au propre de FLUX 3 Klein à partir du croquis validé de la case (image → image, denoise réglable) : 15 pas, cfg 2,5, er_sde/simple. Aucun LoRA (licence).
distilled: false   # cfg 2,5 : ce point de contrôle lit le négatif dès que cfg > 1 (mesuré)
workflow_file: flux3-klein-qualite-from-sketch.json
output_node: "9"
timeout_s: 1800
role: propre
with_references: flux3-klein-edit-ref-qualite-from-sketch   # même palier pour les vignettes avec fiches
tier:
  name: Qualité
estimated_s: 110
# Image de composition (croquis validé) : envoyée à ComfyUI puis écrite dans ce LoadImage.
source_image: { node: "30", input: image }
mapping:
  positive_prompt: { node: "4", input: text }
  negative_prompt: { node: "5", input: text }
  seed: { node: "7", input: seed }
  steps: { node: "7", input: steps }
  cfg: { node: "7", input: cfg }
  denoise: { node: "7", input: denoise }
  # Taille finale : celle du croquis agrandi (le latent en découle).
  width: { node: "31", input: width }
  height: { node: "31", input: height }
  filename_prefix: { node: "9", input: filename_prefix }
defaults:
  negative_prompt: "text, letters, speech bubble, caption, watermark, signature, multiple panels, comic page layout, collage, split screen, character sheet, turnaround, model sheet, white background, duplicate character, extra people, extra limbs, deformed hands, blurry, low quality"
  steps: 15
  cfg: 2.5
  # Part du croquis redessinée : 0 = croquis inchangé, 1 = image neuve (composition perdue).
  denoise: 0.65
  width: 1024
  height: 1024
  filename_prefix: mangaka/case
