# Qwen-Image 2.1 · Croquis — avec images de référence (personnages, décor, objets).
# Même graphe que « Turbo — avec images de référence », petite image et 6 étapes (voir
# qwen-image-croquis.yaml). Les références de la case sont conservées : le croquis montre déjà
# les bons personnages.
# Graphe provisoire, À REMPLACER par l'export réel de Morigane (~/mangaka-comfy-exports/).
id: qwen-image-edit-ref-croquis
name: "Qwen-Image 2.1 · Croquis — avec images de référence"
description: >-
  Palier croquis guidé par jusqu'à 3 images de référence (modèle Turbo distillé int8, ~512 px, 6 étapes), LoRA de la série conservés.
workflow_file: qwen-image-edit-ref-croquis.json
output_node: "11"
timeout_s: 180   # au-delà, la génération est interrompue et le job passe en échec
role: croquis
tier:
  name: Croquis
# Durée d'une case (s) tant qu'il y a moins de 3 générations terminées avec ce preset.
estimated_s: 10
long_side: 512
mapping:
  positive_prompt: { node: "6", input: prompt }
  negative_prompt: { node: "6", input: negative_prompt }
  seed: { node: "9", input: seed }
  steps: { node: "9", input: steps }
  cfg: { node: "9", input: cfg }
  width: { node: "8", input: width }
  height: { node: "8", input: height }
  filename_prefix: { node: "11", input: filename_prefix }
reference_images:
  - { node: "20", input: image }
  - { node: "21", input: image }
  - { node: "22", input: image }
lora_chain:
  class_type: LoraLoaderModelOnly
  model_from: { node: "1", output: 0 }
  model_input: model
  name_input: lora_name
  strength_input: strength_model
defaults:
  negative_prompt: "texte, lettres, bulles, filigrane, signature, flou, mains déformées"
  steps: 6
  cfg: 1
  width: 512
  height: 512
  filename_prefix: mangaka/croquis
# « Générer une case d'essai » (tableau de bord).
trial:
  positive_prompt: >-
    manga panel, black and white ink, screentone shading, a young swordswoman standing on a
    rooftop at dusk, wind in her hair, dynamic angle
  width: 512
  height: 512
  steps: 6
  filename_prefix: mangaka/essai
