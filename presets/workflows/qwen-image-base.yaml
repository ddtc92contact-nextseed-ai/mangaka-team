# Qwen-Image 2.1 · Qualité — texte → image (bf16).
# JSON au format API, construit d'après le workflow de référence de la GX10
# (~/ComfyUI/user/default/workflows/image_qwen_image_2_1_image_edit.json, sous-graphe
# « Image Edit (Qwen Image 2.1) ») : mêmes chargeurs, mêmes options, même échantillonneur.
# Voir presets/README.md (paliers Qualité / Rapide, ré-export).
id: qwen-image-base
name: "Qwen-Image 2.1 · Qualité — texte → image"
description: >-
  Palier Qualité : modèle et encodeur bf16, 50 étapes. Case générée à partir du prompt final, sans image de référence (LoRA de style et d'identité possibles).
workflow_file: qwen-image-base.json
output_node: "11"
timeout_s: 1200   # au-delà, la génération est interrompue et le job passe en échec
from_sketch: qwen-image-base-from-sketch   # « Passer au propre » depuis un croquis validé, même palier
with_references: qwen-image-edit-ref   # cases avec images de référence
inpaint_with: qwen-image-inpaint   # réparation ciblée (inpainting) du même palier
with_control: qwen-image-base-controlnet   # composition verrouillée (ControlNet), même palier
tier:
  name: Qualité
  choice: "Qualité (finitions)"   # libellé du palier dans la fiche série
  order: 3
# Durée d'une case (s) tant qu'il y a moins de 3 générations terminées avec ce preset.
estimated_s: 70
mapping:
  # TextEncodeQwenImage21 encode les deux prompts : sorties 0 (positif) et 1 (négatif).
  positive_prompt: { node: "6", input: prompt }
  negative_prompt: { node: "6", input: negative_prompt }
  seed: { node: "9", input: seed }
  steps: { node: "9", input: steps }
  cfg: { node: "9", input: cfg }
  width: { node: "8", input: width }
  height: { node: "8", input: height }
  filename_prefix: { node: "11", input: filename_prefix }
# LoRA (style de la série puis identité de chaque personnage) chaînés après le modèle :
# chaque LoRA devient un nœud `class_type` inséré entre le nœud 1 (UNETLoader) et le cache (nœud 4).
lora_chain:
  class_type: LoraLoaderModelOnly
  model_from: { node: "1", output: 0 }
  model_input: model
  name_input: lora_name
  strength_input: strength_model
defaults:
  # cfg 1 = chemin officiel de Qwen-Image 2.1 : le prompt négatif est alors ignoré par le modèle.
  negative_prompt: "texte, lettres, bulles, filigrane, signature, flou, mains déformées"
  steps: 50
  cfg: 1
  width: 1024
  height: 1024
  filename_prefix: mangaka/case
# « Générer une case d'essai » (tableau de bord) : petite image, peu d'étapes.
trial:
  positive_prompt: >-
    manga panel, black and white ink, screentone shading, a young swordswoman standing on a
    rooftop at dusk, wind in her hair, dynamic angle
  width: 512
  height: 512
  steps: 12
  filename_prefix: mangaka/essai
