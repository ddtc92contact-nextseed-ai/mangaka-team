# FLUX 3 Image Klein · Qualité (avec images de référence) — propre depuis un croquis validé.
# Écrit par Morigane le 16/10/2026. Le croquis validé donne la composition (latent de départ,
# nœuds 30 → 31 → 32), les fiches donnent l'identité (ReferenceMultiLatent, nœuds 20-24) :
# exactement le partage du palier équivalent chez Qwen. Même graphe que
# « flux3-klein-edit-ref-qualite », seule l'origine du latent change.
id: flux3-klein-edit-ref-qualite-from-sketch
engine: flux3-klein
name: "FLUX 3 Klein · Qualité — propre depuis croquis (avec références)"
description: >-
  Passage au propre de FLUX 3 Klein depuis le croquis validé de la case, guidé par jusqu'à 5 images de référence des fiches : 15 pas, cfg 2,5, denoise réglable. Aucun LoRA (licence).
distilled: false
workflow_file: flux3-klein-edit-ref-qualite-from-sketch.json
output_node: "9"
timeout_s: 1800
role: propre
tier:
  name: Qualité
estimated_s: 140
source_image: { node: "30", input: image }
mapping:
  positive_prompt: { node: "4", input: text }
  negative_prompt: { node: "5", input: text }
  seed: { node: "7", input: seed }
  steps: { node: "7", input: steps }
  cfg: { node: "7", input: cfg }
  denoise: { node: "7", input: denoise }
  width: { node: "31", input: width }
  height: { node: "31", input: height }
  filename_prefix: { node: "9", input: filename_prefix }
reference_images:
  - { node: "20", input: image }
  - { node: "21", input: image }
  - { node: "22", input: image }
  - { node: "23", input: image }
  - { node: "24", input: image }
defaults:
  negative_prompt: "text, letters, speech bubble, caption, watermark, signature, multiple panels, comic page layout, collage, split screen, character sheet, turnaround, model sheet, white background, duplicate character, extra people, extra limbs, deformed hands, blurry, low quality"
  steps: 15
  cfg: 2.5
  denoise: 0.65
  width: 1024
  height: 1024
  filename_prefix: mangaka/case
