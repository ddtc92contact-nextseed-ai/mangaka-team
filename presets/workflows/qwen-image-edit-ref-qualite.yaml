# Qwen-Image 2.1 · Qualité — avec images de référence (int8 convrot, vrai CFG).
# L'édition / la référence est intégrée au modèle 2.1 : pas de modèle « edit » séparé.
# JSON au format API, construit d'après le workflow de référence de la GX10
# (~/ComfyUI/user/default/workflows/image_qwen_image_2_1_image_edit.json, sous-graphe
# « Image Edit (Qwen Image 2.1) ») : mêmes chargeurs, mêmes options, même échantillonneur.
# Voir presets/README.md (paliers Qualité / Rapide, ré-export).
id: qwen-image-edit-ref-qualite
engine: qwen-image
name: "Qwen-Image 2.1 · Qualité — avec images de référence"
description: >-
  Palier Qualité (int8 convrot, 35 étapes, cfg 2,5 : négatif actif) guidé par jusqu'à 5 images de référence des personnages (une par emplacement, dans l'ordre), avec LoRA de style et d'identité.
distilled: false   # modèle de base (non distillé) : cfg > 1 permis, le négatif est lu
workflow_file: qwen-image-edit-ref-qualite.json
output_node: "11"
timeout_s: 2700   # au-delà, la génération est interrompue et le job passe en échec
from_sketch: qwen-image-edit-ref-qualite-from-sketch   # « Passer au propre » depuis un croquis validé, même palier
inpaint_with: qwen-image-inpaint-rapide   # réparation ciblée (inpainting) : celle de Rapide (mêmes fichiers int8)
with_control: qwen-image-edit-ref-qualite-controlnet   # composition verrouillée (ControlNet), même palier
tier:
  name: Qualité
# Durée d'une case (s) tant qu'il y a moins de 3 générations terminées avec ce preset :
# ≈ 2× Rapide par étape (cfg > 1 : passe négative en plus), 35 étapes au lieu de 25.
estimated_s: 672
mapping:
  # TextEncodeQwenImage21 encode les deux prompts : sorties 0 (positif) et 1 (négatif).
  positive_prompt: { node: "6", input: prompt }
  negative_prompt: { node: "6", input: negative_prompt }
  seed: { node: "9", input: seed }
  steps: { node: "9", input: steps }
  cfg: { node: "9", input: cfg }
  width: { node: "8", input: width }
  height: { node: "8", input: height }
  filename_prefix: { node: "11", input: filename_prefix }
# Emplacements d'images de référence (LoadImage), remplis dans l'ordre et branchés sur les
# entrées images.image_1…5 de l'encodeur (nœud 6). Un emplacement inutilisé est retiré et son
# entrée images.image_N disparaît de l'encodeur (entrées optionnelles) : rien d'autre à retirer.
reference_images:
  - { node: "20", input: image }
  - { node: "21", input: image }
  - { node: "22", input: image }
  - { node: "23", input: image }
  - { node: "24", input: image }
# LoRA (style de la série puis identité de chaque personnage) chaînés après le modèle :
# chaque LoRA devient un nœud `class_type` inséré entre le nœud 1 (UNETLoader) et le cache (nœud 4).
lora_chain:
  class_type: LoraLoaderModelOnly
  model_from: { node: "1", output: 0 }
  model_input: model
  name_input: lora_name
  strength_input: strength_model
defaults:
  # Vrai CFG (cfg 2,5 ; garder ≤ 3 : au-delà, image trop contrastée) : ce négatif est lu par le modèle.
  negative_prompt: "text, letters, speech bubble, caption, watermark, signature, multiple panels, comic page layout, collage, split screen, character sheet, turnaround, model sheet, white background, duplicate character, extra people, extra limbs, deformed hands, blurry, low quality"
  steps: 35
  cfg: 2.5
  width: 1024
  height: 1024
  filename_prefix: mangaka/case
# « Générer une case d'essai » (tableau de bord) : petite image, peu d'étapes.
trial:
  positive_prompt: >-
    manga panel, black and white ink, screentone shading, a young swordswoman standing on a
    rooftop at dusk, wind in her hair, dynamic angle
  width: 512
  height: 512
  steps: 8
  filename_prefix: mangaka/essai
