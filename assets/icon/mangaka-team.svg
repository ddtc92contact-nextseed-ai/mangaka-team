<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Mangaka Team</title>
  <!-- Icône originale : une planche à trois cases, un pinceau à l'encre et une bulle. -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27272a"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="manche" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <clipPath id="case-haut">
      <polygon points="104,108 408,108 408,212 104,250"/>
    </clipPath>
  </defs>

  <!-- Fond sombre de l'interface -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#fond)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="102.5" fill="none" stroke="#3f3f46" stroke-width="3"/>

  <!-- Planche : trois cases au découpage dynamique -->
  <g stroke="#09090b" stroke-width="10" stroke-linejoin="round">
    <polygon points="104,108 408,108 408,212 104,250" fill="#fafafa"/>
    <polygon points="104,274 236,258 220,408 104,408" fill="#f4f4f5"/>
    <polygon points="258,255 408,237 408,408 242,408" fill="#e4e4e7"/>
  </g>

  <!-- Lignes de vitesse dans la case du haut -->
  <g clip-path="url(#case-haut)" stroke="#a1a1aa" stroke-width="5" stroke-linecap="round">
    <line x1="150" y1="218" x2="270" y2="140"/>
    <line x1="120" y1="196" x2="230" y2="126"/>
    <line x1="196" y1="226" x2="300" y2="160"/>
    <line x1="126" y1="160" x2="190" y2="120"/>
  </g>

  <!-- Trame (points) dans la case en bas à droite -->
  <g fill="#a1a1aa">
    <circle cx="282" cy="290" r="5"/><circle cx="310" cy="286" r="5"/><circle cx="338" cy="282" r="5"/>
    <circle cx="366" cy="279" r="5"/><circle cx="296" cy="314" r="4"/><circle cx="324" cy="310" r="4"/>
    <circle cx="352" cy="306" r="4"/><circle cx="380" cy="303" r="4"/><circle cx="310" cy="338" r="3"/>
    <circle cx="338" cy="334" r="3"/><circle cx="366" cy="330" r="3"/>
  </g>

  <!-- Trait d'encre laissé par le pinceau -->
  <path d="M130 390 C 158 336, 184 362, 208 330 S 262 330, 288 360" fill="none" stroke="#09090b"
        stroke-width="14" stroke-linecap="round"/>

  <!-- Pinceau : pointe posée au bout du trait, manche vers le haut à droite -->
  <g transform="translate(290 362) rotate(50)">
    <rect x="-16" y="-232" width="32" height="132" rx="16" fill="url(#manche)" stroke="#09090b" stroke-width="8"/>
    <rect x="-20" y="-110" width="40" height="32" rx="5" fill="#d4d4d8" stroke="#09090b" stroke-width="8"/>
    <path d="M0 0 Q -6 -40 -18 -80 L 18 -80 Q 6 -40 0 0 Z" fill="#09090b" stroke="#09090b" stroke-width="8"
          stroke-linejoin="round"/>
  </g>

  <!-- Bulle de dialogue -->
  <g>
    <path d="M318 60 C 262 60, 236 92, 236 122 C 236 154, 266 180, 318 180 C 330 180, 341 179, 351 176
             L 330 214 L 378 168 C 402 156, 414 140, 414 122 C 414 90, 378 60, 318 60 Z"
          fill="#ffffff" stroke="#09090b" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="288" cy="122" r="11" fill="#e11d48"/>
    <circle cx="325" cy="122" r="11" fill="#e11d48"/>
    <circle cx="362" cy="122" r="11" fill="#e11d48"/>
  </g>
</svg>
